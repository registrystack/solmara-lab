services:
  esignet-database:
    image: ${SOLMARA_ESIGNET_POSTGRES_IMAGE:?set a verified digest-pinned native v2 image}
    environment:
      POSTGRES_USER: esignet
      POSTGRES_PASSWORD: ${SOLMARA_ESIGNET_POSTGRES_PASSWORD:?run just gen-secrets}
    volumes:
    - esignet-v2-db-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U esignet -d esignet
      interval: 5s
      timeout: 5s
      retries: 30
  esignet-redis:
    image: ${ESIGNET_REDIS_IMAGE:?versions.env must pin eSignet Redis}
    command:
    - redis-server
    volumes:
    - esignet-v2-redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli --raw COMMAND INFO GETDEL | grep -qx getdel
      interval: 10s
      timeout: 5s
      retries: 30
  esignet:
    image: ${SOLMARA_ESIGNET_RELAY_IMAGE:?set a verified digest-pinned native v2 image}
    environment:
      DATA_DIR: /home/mosip/data
      PORT: '8080'
      MOSIP_ESIGNET_AUTHN_PROVIDER: breg
      MOSIP_ESIGNET_AUTH_FLOW_ID: flow-breg-otp
      MOSIP_ESIGNET_HOST: ${SOLMARA_ESIGNET_PUBLIC_BASE_URL:-https://esignet.solmara.registrystack.org}
      MOSIP_ESIGNET_OIDC_UI_SCHEME: https
      MOSIP_ESIGNET_OIDC_UI_HOSTNAME: ${SOLMARA_ESIGNET_UI_PUBLIC_HOST:-esignet-ui.solmara.registrystack.org}
      MOSIP_ESIGNET_OIDC_UI_PORT: '443'
      MOSIP_ESIGNET_OIDC_UI_LOGIN_PATH: /signin
      DATABASE_HOST: esignet-database
      DATABASE_PORT: '5432'
      DATABASE_NAME: mosip_esignet
      DATABASE_USERNAME: esignet
      DATABASE_PASSWORD: ${SOLMARA_ESIGNET_POSTGRES_PASSWORD:?run just gen-secrets}
      REDIS_HOST: esignet-redis
      KEYMANAGER_DB_SCHEMA: esignet
      KEYMANAGER_KEYSTORE_TYPE: PKCS12
      KEYMANAGER_PKCS12_FILE_PATH: /var/lib/esignet-keys/host.p12
      KEYMANAGER_PKCS12_PASSWORD: ${SOLMARA_ESIGNET_V2_KEYSTORE_PASSWORD:?run just gen-secrets}
      KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE: 'true'
      KEYMANAGER_CERT_CN: Solmara synthetic identity demo
      KEYMANAGER_CERT_O: Solmara Lab
      KEYMANAGER_CERT_C: XS
      REGISTRY_ESIGNET_CONFIG_FILE: /etc/registry-esignet/registry.yaml
    volumes:
    - esignet-v2-keys:/var/lib/esignet-keys
    - esignet-v2-config:/etc/registry-esignet:ro
    depends_on:
      esignet-database:
        condition: service_healthy
      esignet-redis:
        condition: service_healthy
      esignet-key-init:
        condition: service_completed_successfully
    labels:
      solmara.rollout.slot: authority-cells
  esignet-seed:
    image: ${SOLMARA_ESIGNET_SEED_IMAGE:?set a verified digest-pinned native v2 image}
    environment:
      ESIGNET_CLIENT_ID: ${PORTAL_ESIGNET_CLIENT_ID:-solmara-portal}
      ESIGNET_CLIENT_KEY_ID: ${PORTAL_ESIGNET_CLIENT_KEY_ID:-solmara-portal-key-1}
      ESIGNET_CLIENT_PRIVATE_KEY_B64: ${PORTAL_ESIGNET_CLIENT_PRIVATE_KEY_B64:?required}
      ESIGNET_ADMIN_URL: http://esignet:8080
      ESIGNET_CLIENT_REDIRECT_URIS_JSON: '["${SOLMARA_PORTAL_PUBLIC_BASE_URL:-https://portal.solmara.registrystack.org}/auth/callback"]'
      ESIGNET_REQUIRE_HTTPS_REDIRECTS: 'true'
    entrypoint:
    - seed-esignet.py
    depends_on:
      esignet-database:
        condition: service_healthy
      esignet:
        condition: service_started
    restart: 'no'
    volumes:
    - esignet-v2-seed-state:/var/lib/esignet-seed/state
  esignet-key-init:
    image: ${VOLUME_INIT_IMAGE:?versions.env must pin volume initializer}
    user: 0:0
    command:
    - sh
    - -c
    - set -eu; cp /source/* /config/; chown -R 65532:65532 /keys /config; chmod 0700 /keys /config; chmod 0600 /config/*
    volumes:
    - esignet-v2-keys:/keys
    - ./config/evidence/local/esignet-v2:/source:ro
    - esignet-v2-config:/config
    restart: 'no'
  esignet_ui:
    image: ${SOLMARA_ESIGNET_UI_IMAGE:?set a verified digest-pinned native v2 image}
    depends_on:
      esignet:
        condition: service_started
    environment:
      SOLMARA_ESIGNET_PUBLIC_HOST: ${SOLMARA_ESIGNET_PUBLIC_HOST:-esignet.solmara.registrystack.org}
      SOLMARA_ESIGNET_UI_PUBLIC_HOST: ${SOLMARA_ESIGNET_UI_PUBLIC_HOST:-esignet-ui.solmara.registrystack.org}
    labels:
      solmara.lab.host: ${SOLMARA_ESIGNET_UI_PUBLIC_HOST:-esignet-ui.solmara.registrystack.org}
      solmara.rollout.slot: authority-cells
  esignet_edge:
    image: ${SOLMARA_ESIGNET_UI_IMAGE:?set a verified digest-pinned native v2 image}
    depends_on:
      esignet:
        condition: service_started
    environment:
      SOLMARA_ESIGNET_PUBLIC_HOST: ${SOLMARA_ESIGNET_PUBLIC_HOST:-esignet.solmara.registrystack.org}
      SOLMARA_ESIGNET_UI_PUBLIC_HOST: ${SOLMARA_ESIGNET_UI_PUBLIC_HOST:-esignet-ui.solmara.registrystack.org}
    labels:
      solmara.lab.host: ${SOLMARA_ESIGNET_PUBLIC_HOST:-esignet.solmara.registrystack.org}
      solmara.rollout.slot: authority-cells
volumes:
  esignet-v2-db-data: null
  esignet-v2-redis-data: null
  esignet-v2-keys: null
  esignet-v2-config: null
  esignet-v2-seed-state: null
name: solmara-esignet-v2-authority-cells
