    volumes: [sipf-evidence-runtime:/provisioned/runtime, sipf-evidence-secrets:/provisioned/secrets]
    secrets:
      - {source: sipf-evidence-signing-public-jwk, target: solmara-provisioning/signing-public.jwk}
      - {source: sipf-evidence-audit-hmac-key, target: solmara-provisioning/audit-hmac-key}
