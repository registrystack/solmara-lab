  mosd-relay-provisioner:
    <<: *provisioner
    command: [provision, --target, mosd-relay, --assets, /opt/solmara-hosted-assets, --secrets, /run/secrets/solmara-provisioning, --runtime-output, /provisioned/runtime, --source-output, /provisioned/source]
