    volumes: [sipf-relay-runtime:/provisioned/runtime, sipf-relay-source:/provisioned/source]

  nagdi-relay-provisioner:
    <<: *provisioner
    command: [provision, --target, nagdi-relay, --assets, /opt/solmara-hosted-assets, --secrets, /run/secrets/solmara-provisioning, --runtime-output, /provisioned/runtime, --source-output, /provisioned/source]
    volumes: [nagdi-relay-runtime:/provisioned/runtime, nagdi-relay-source:/provisioned/source]

  cra-evidence-provisioner:
    <<: *provisioner
    command: [provision, --target, cra-evidence, --assets, /opt/solmara-hosted-assets, --secrets, /run/secrets/solmara-provisioning, --runtime-output, /provisioned/runtime, --secret-output, /provisioned/secrets, --extract-output, /provisioned/extracts, --bind-host, 172.29.2.21]
