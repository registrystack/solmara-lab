name: solmara-authority-cells

# This operator-only application owns every active runtime volume. Runtime
# applications attach them by fixed external name and never receive write
# access to authored contracts, source publications, extracts, or secrets.
x-provisioner: &provisioner
  image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
  restart: "no"
  read_only: true
  tmpfs: [/tmp]
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-transit-init: &transit-init
  image: ${SOLMARA_TRANSIT_SIGNER_IMAGE:?set the digest-pinned Solmara Transit signer image}
  entrypoint: [/usr/local/bin/python, -c]
  command: ["import os,stat,sys; p='/transit'; s=os.lstat(p); ok=stat.S_ISDIR(s.st_mode) and not stat.S_ISLNK(s.st_mode); not ok and sys.exit(1); os.chown(p,65532,65532); os.chmod(p,0o700)"]
  restart: "no"
  user: "0:0"
  read_only: true
  tmpfs: [/tmp]
  network_mode: none
  cap_drop: [ALL]
  cap_add: [CHOWN, FOWNER]
  security_opt: [no-new-privileges:true]

x-signer: &signer
  image: ${SOLMARA_TRANSIT_SIGNER_IMAGE:?set the digest-pinned Solmara Transit signer image}
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  tmpfs: [/tmp]
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, /usr/local/bin/python, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/transit/transit-proxy.sock'); s.close()"]
    interval: 2s
    timeout: 1s
    retries: 30
    start_period: 2s

services:
  cra-relay-provisioner:
    <<: *provisioner
    command: [provision, --target, cra-relay, --assets, /opt/solmara-hosted-assets, --secrets, /run/secrets/solmara-provisioning, --runtime-output, /provisioned/runtime, --source-output, /provisioned/source]
    volumes: [cra-relay-runtime:/provisioned/runtime, cra-relay-source:/provisioned/source]

  nia-relay-provisioner:
    <<: *provisioner
    command: [provision, --target, nia-relay, --assets, /opt/solmara-hosted-assets, --secrets, /run/secrets/solmara-provisioning, --runtime-output, /provisioned/runtime, --source-output, /provisioned/source]
