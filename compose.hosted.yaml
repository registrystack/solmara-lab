# Overlay for the side-by-side authority-cell rollout. The previous deployment's
# volumes remain externally named and are never attached, changed, or deleted.
x-solmara-rollout:
  phase: ${SOLMARA_AUTHORITY_CELLS_PHASE:-side-by-side}
  switch: ${SOLMARA_AUTHORITY_CELLS_SWITCH:-disabled}
  superseded-volume-policy: retain

x-hosted-relay: &hosted-relay
  image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
  build: !reset null
  labels:
    solmara.rollout.slot: authority-cells
    solmara.rollout.phase: ${SOLMARA_AUTHORITY_CELLS_PHASE:-side-by-side}

x-hosted-evidence: &hosted-evidence
  image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
  build: !reset null
  labels:
    solmara.rollout.slot: authority-cells
    solmara.rollout.phase: ${SOLMARA_AUTHORITY_CELLS_PHASE:-side-by-side}

services:
  cra-relay: {<<: *hosted-relay}
  nia-relay: {<<: *hosted-relay}
  mosd-relay: {<<: *hosted-relay}
  sipf-relay: {<<: *hosted-relay}
  nagdi-relay: {<<: *hosted-relay}

  cra-evidence: {<<: *hosted-evidence}
  nia-evidence: {<<: *hosted-evidence}
  sro-evidence: {<<: *hosted-evidence}
  mosd-programme-evidence: {<<: *hosted-evidence}
  sipf-evidence: {<<: *hosted-evidence}
  nagdi-evidence: {<<: *hosted-evidence}

  mint:
    image: ${SOLMARA_MINT_IMAGE:?set the digest-pinned official Registry Stack Mint image}
    build: !reset null
    labels:
      solmara.rollout.slot: authority-cells
      solmara.rollout.phase: ${SOLMARA_AUTHORITY_CELLS_PHASE:-side-by-side}

  static-metadata:
    image: ${SOLMARA_STATIC_METADATA_IMAGE:?set a digest-pinned Solmara static metadata image}
  scenario-runner:
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:?set a digest-pinned Solmara scenario runner image}
    build: !reset null
    environment:
      SOLMARA_LAB_MODE: hosted
      SOLMARA_MINT_URL: https://mint.solmara.registrystack.org
      SOLMARA_CRA_EVIDENCE_URL: https://cra-evidence.solmara.registrystack.org
      SOLMARA_NIA_EVIDENCE_URL: https://nia-evidence.solmara.registrystack.org
      SOLMARA_SRO_EVIDENCE_URL: https://sro-evidence.solmara.registrystack.org
      SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: https://mosd-programme-evidence.solmara.registrystack.org
      SOLMARA_SIPF_EVIDENCE_URL: https://sipf-evidence.solmara.registrystack.org
      SOLMARA_NAGDI_EVIDENCE_URL: https://nagdi-evidence.solmara.registrystack.org
  child-benefit-federator:
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:?set a digest-pinned Solmara scenario runner image}
    build: !reset null
    environment:
      SOLMARA_MINT_URL: https://mint.solmara.registrystack.org
      SOLMARA_CRA_EVIDENCE_URL: https://cra-evidence.solmara.registrystack.org
      SOLMARA_NIA_EVIDENCE_URL: https://nia-evidence.solmara.registrystack.org
      SOLMARA_SRO_EVIDENCE_URL: https://sro-evidence.solmara.registrystack.org
      SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: https://mosd-programme-evidence.solmara.registrystack.org
  portal:
    image: ${SOLMARA_PORTAL_IMAGE:?set a digest-pinned Solmara portal image}
    build: !reset null
  home:
    image: ${SOLMARA_HOME_IMAGE:?set a digest-pinned Solmara home image}
    build: !reset null

volumes:
  superseded-interior-state:
    external: true
    name: ${SOLMARA_SUPERSEDED_INTERIOR_VOLUME:-solmara-lab-interior-state}
  superseded-social-development-state:
    external: true
    name: ${SOLMARA_SUPERSEDED_SOCIAL_VOLUME:-solmara-lab-social-development-state}
  superseded-pensions-state:
    external: true
    name: ${SOLMARA_SUPERSEDED_PENSIONS_VOLUME:-solmara-lab-pensions-state}
  superseded-agriculture-state:
    external: true
    name: ${SOLMARA_SUPERSEDED_AGRICULTURE_VOLUME:-solmara-lab-agriculture-state}
