name: opencrvs-v2-no-match
classification: synthetic
input:
  registration_number: SYNTHREG0002
  child_national_id: "9999000003"
  tracking_id: SYN002
interactions:
  - expect:
      method: POST
      path: /token
      headers:
        Accept: application/json
        Content-Type: application/x-www-form-urlencoded
      body: { grant_type: client_credentials }
    respond:
      status: 200
      headers:
        Content-Type: application/json
      body:
        access_token: SYNTHETIC_FIXTURE_TOKEN
        token_type: Bearer
  - expect:
      method: POST
      path: /events/events/search
      body:
        query:
          type: and
          clauses:
            - eventType: birth
              legalStatuses.REGISTERED.registrationNumber:
                type: exact
                term: SYNTHREG0002
        limit: 2
        offset: 0
    respond: { status: 200, body: { total: 0, results: [] } }
expect:
  outcome: no_match
  outputs: {}
  claims:
    birth-record-exists: false
    registration-number-matches: null
    child-national-id-matches: null
    mother-recorded-on-birth: null
    informant-is-mother: null
