name: opencrvs-v2-event-type-mismatch
classification: synthetic
input:
  registration_number: SYNTHREG0007
  child_national_id: "9999000009"
  tracking_id: SYN009
interactions:
  - expect:
      method: POST
      path: /token
      headers:
        Accept: application/json
        Content-Type: application/x-www-form-urlencoded
      body: { grant_type: client_credentials }
    respond:
      status: 200
      body:
        access_token: SYNTHETIC_FIXTURE_TOKEN
        token_type: Bearer
  - expect:
      method: POST
      path: /events/events/search
      body:
        query:
          type: and
          clauses:
            - eventType: birth
              legalStatuses.REGISTERED.registrationNumber:
                type: exact
                term: SYNTHREG0007
        limit: 2
        offset: 0
    respond:
      status: 200
      body:
        total: 1
        results:
          - { type: death, trackingId: SYN009 }
expect:
  error: failure.subject_mismatch
  outputs: {}
  claims: {}
