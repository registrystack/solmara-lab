name: opencrvs-v2-ambiguous
classification: synthetic
input:
  registration_number: SYNTHREG0003
  child_national_id: "9999000004"
  tracking_id: SYN003
interactions:
  - expect:
      method: POST
      path: /token
      headers:
        Accept: application/json
        Content-Type: application/x-www-form-urlencoded
      body: { grant_type: client_credentials }
    respond:
      status: 200
      headers:
        Content-Type: application/json
      body:
        access_token: SYNTHETIC_FIXTURE_TOKEN
        token_type: Bearer
  - expect:
      method: POST
      path: /events/events/search
      body:
        query:
          type: and
          clauses:
            - eventType: birth
              legalStatuses.REGISTERED.registrationNumber:
                type: exact
                term: SYNTHREG0003
        limit: 2
        offset: 0
    respond:
      status: 200
      body:
        total: 2
        results:
          - { type: birth, trackingId: SYN003 }
          - { type: birth, trackingId: SYN004 }
expect:
  outcome: ambiguous
  outputs: {}
  claims: {}
