version: 1
validationMode: strict
issuer: https://mint.solmara.registrystack.org
listener:
  address: 0.0.0.0
  port: 8081
signing:
  algorithm: ES256
  activePublicJwkFile: public-keys/active.jwk.json
  publishedPublicJwkFiles: []
  revokedKeyIds: []
  jwksPath: /.well-known/jwks.json
signer:
  kind: transit
  unixSocketPath: /run/registry-mint/transit-proxy.sock
  mount: transit
  keyName: mint-signing
  keyVersion: 1
  timeoutMilliseconds: 2000
secretProviders:
  file:
    root: /run/secrets/registry-mint
audit:
  path: /var/lib/registry-mint/audit/mint.jsonl
  maximumFileBytes: 1073741824
  hashKeyRef: secret:file/audit-hmac-key
  hashKeyVersion: 1
accessTokens:
  audiences: [solmara-evidence]
  lifetimeSeconds: 300
  claims:
    principal: sub
    requesterTags: evidence_tags
    evidenceAudience: evidence_audience
    grantId: evidence_grant_id
    grantAuthority: evidence_authority
clientAssertion:
  audience: https://mint.solmara.registrystack.org/token
  maximumLifetimeSeconds: 300
  algorithms: [ES256]
clients:
  directory: /etc/registry-mint/clients
