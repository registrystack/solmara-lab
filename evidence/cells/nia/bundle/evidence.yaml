version: 1
assuranceProfile: production
service: { providerId: https://id.registrystack.org/solmara/evidence/nia, trustDomain: https://id.registrystack.org/solmara/trust-domain/lab, publicOrigin: https://nia-evidence.solmara.registrystack.org }
issuer: { id: did:web:id.registrystack.org:solmara:authority:nia }
authentication: { kind: oidc-access-token, issuer: https://mint.solmara.registrystack.org, audiences: [solmara-runtime], tokenTypes: [at+jwt], algorithms: [ES256], jwksUri: https://mint.solmara.registrystack.org/.well-known/jwks.json, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, grantIdClaim: evidence_grant_id, grantAuthorityClaim: evidence_authority, maximumTokenLifetimeSeconds: 300, revokedKeyIds: [] }
audit: { format: keyed-jsonl, hashSecretRef: secret:file/audit-hmac-key, hashKeyVersion: 1, failClosed: true }
subjectBinding: { secretRef: secret:file/subject-binding-hmac-key, keyVersion: 1 }
rateLimits: { requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10 }
signing: { format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/nia.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 3600, verifierClockSkewSeconds: 30 }
responseFormats: [signed-jws]
selectorProfiles:
  solmara-uin-v1: { maximumAggregateBytes: 16, fields: { uin: { type: string, minimumBytes: 10, maximumBytes: 10 } } }
sources:
  population-extract:
    transport: sqlite-extract
    extractProfile: nia-population-extract
    posture: source-derived
    maximumExtractAgeSeconds: 86400
    request:
      statement: queries/population-evidence.sql
      columns: [{ name: uin, type: string }, { name: identity_status, type: string }, { name: alive, type: boolean }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      parameterBindings: { uin: { kind: selector, role: subject, profile: solmara-uin-v1, field: uin } }
      projection: [/rows/*/uin, /rows/*/identity_status, /rows/*/alive]
      maximumRows: 2
      maximumCellBytes: 128
      maximumStatementSteps: 100000
      timeoutMilliseconds: 2000
      maximumResponseBytes: 8192
      concurrencyLimit: 8
    responseSchema: schemas/population-response.schema.yaml
    extractScript: adapters/sqlite-extract.rhai
    factSchema: schemas/population-facts.schema.yaml
authorityProfiles:
  nia-consumers-v1:
    kind: statutory
    requesterTags: [solmara-demo]
    grants:
      - { requirement: https://id.registrystack.org/solmara/requirement/nia-child-benefit/v1, purpose: child-benefit-review, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
      - { requirement: https://id.registrystack.org/solmara/requirement/nia-citizen-status/v1, purpose: citizen-self-service, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
requirements:
  - handle: nia-child-benefit
    id: https://id.registrystack.org/solmara/requirement/nia-child-benefit/v1
    kind: information-requirement
    acquisition: { kind: single, source: population-extract }
    purposes: [child-benefit-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/child-benefit/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/population-active/v1
    validitySeconds: 3600
    derivation: { script: derivations/population-active.rhai, parameters: { concept_id: https://id.registrystack.org/solmara/concept/population-record-active } }
    concepts: [{ handle: population-record-active, id: https://id.registrystack.org/solmara/concept/population-record-active, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/child-benefit.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/nia-child-benefit] }
    existenceDisclosure: collapse-unresolved
  - handle: nia-citizen-status
    id: https://id.registrystack.org/solmara/requirement/nia-citizen-status/v1
    kind: information-requirement
    acquisition: { kind: single, source: population-extract }
    purposes: [citizen-self-service]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/citizen-self-service/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/citizen-population-active/v1
    validitySeconds: 3600
    derivation: { script: derivations/population-active.rhai, parameters: { concept_id: https://id.registrystack.org/solmara/concept/citizen-population-record-active } }
    concepts: [{ handle: citizen-population-record-active, id: https://id.registrystack.org/solmara/concept/citizen-population-record-active, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/citizen.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/nia-citizen] }
    existenceDisclosure: collapse-unresolved
