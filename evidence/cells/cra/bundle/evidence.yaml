version: 1
assuranceProfile: production
service: { providerId: https://id.registrystack.org/solmara/evidence/cra, trustDomain: https://id.registrystack.org/solmara/trust-domain/lab }
issuer: { id: did:web:id.registrystack.org:solmara:authority:cra }
authentication: { kind: oidc-access-token, issuer: https://mint.solmara.registrystack.org, audiences: [solmara-runtime], tokenTypes: [at+jwt], algorithms: [ES256], jwksUri: https://mint.solmara.registrystack.org/.well-known/jwks.json, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, grantIdClaim: evidence_grant_id, grantAuthorityClaim: evidence_authority, maximumTokenLifetimeSeconds: 300, revokedKeyIds: [] }
audit: { format: keyed-jsonl, hashSecretRef: secret:file/audit-hmac-key, hashKeyVersion: 1, failClosed: true }
subjectBinding: { secretRef: secret:file/subject-binding-hmac-key, keyVersion: 1 }
rateLimits: { requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10 }
signing: { format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/cra.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 3600, verifierClockSkewSeconds: 30 }
responseFormats: [signed-jws]
selectorProfiles:
  solmara-uin-v1: { maximumAggregateBytes: 16, fields: { uin: { type: string, minimumBytes: 10, maximumBytes: 10 } } }
sources:
  cra-child-benefit:
    transport: sqlite-extract
    extractProfile: cra-birth-extract
    posture: source-derived
    maximumExtractAgeSeconds: 86400
    request:
      statement: queries/birth-evidence.sql
      columns: [{ name: uin, type: string }, { name: birth_date, type: string }, { name: birth_brn, type: string }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      parameterBindings: { uin: { kind: selector, role: subject, profile: solmara-uin-v1, field: uin } }
      projection: [/rows/*/uin, /rows/*/birth_date, /rows/*/birth_brn]
      maximumRows: 2
      maximumCellBytes: 256
      maximumStatementSteps: 100000
      timeoutMilliseconds: 2000
      maximumResponseBytes: 8192
      concurrencyLimit: 8
    responseSchema: schemas/birth-response.schema.yaml
    extractScript: adapters/birth-extract.rhai
    factSchema: schemas/birth-facts.schema.yaml
  cra-pension:
    transport: http-json
    baseUrl: https://cra-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/cra-pension-evidence-client-id, clientAssertionKeyRef: secret:file/cra-pension-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:cra:death-by-uin', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: &relay-unresolved { status: 404, type: https://id.registrystack.org/problems/registry-relay/consultation/unresolved, code: consultation.unresolved }
    request:
      method: POST
      path: /v2/resources/civil-person/lookups/death-by-uin
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: deceased }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 64, maximumNormalizedBytes: 1024 }
      projection: [/data/domainData/deceased]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/deceased-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/deceased-facts.schema.yaml
  cra-citizen:
    transport: http-json
    baseUrl: https://cra-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/cra-citizen-evidence-client-id, clientAssertionKeyRef: secret:file/cra-citizen-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:cra:citizen-link-by-uin', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: *relay-unresolved
    request:
      method: POST
      path: /v2/resources/civil-person/lookups/citizen-link-by-uin
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: linkedUin }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 64, maximumNormalizedBytes: 1024 }
      projection: [/data/domainData/linkedUin]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/linked-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/linked-facts.schema.yaml
authorityProfiles:
  cra-consumers-v1:
    kind: statutory
    requesterTags: [solmara-demo]
    grants:
      - { requirement: https://id.registrystack.org/solmara/requirement/cra-child-benefit/v1, purpose: child-benefit-review, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
      - { requirement: https://id.registrystack.org/solmara/requirement/cra-pension-death/v1, purpose: pension-payment-review, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
      - { requirement: https://id.registrystack.org/solmara/requirement/cra-citizen-record/v1, purpose: citizen-self-service, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
requirements:
  - id: https://id.registrystack.org/solmara/requirement/cra-child-benefit/v1
    kind: information-requirement
    acquisition: { kind: single, source: cra-child-benefit }
    purposes: [child-benefit-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/child-benefit/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/cra-child-benefit/v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 3600
    derivation: { script: derivations/child-benefit.rhai, parameters: { as_of_date: '2026-07-14' } }
    concepts: [{ id: https://id.registrystack.org/solmara/concept/birth-is-registered, form: boolean, required: true, constraints: {} }, { id: https://id.registrystack.org/solmara/concept/child-age-under-5, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/child-benefit.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/cra-child-benefit] }
    existenceDisclosure: collapse-unresolved
  - id: https://id.registrystack.org/solmara/requirement/cra-pension-death/v1
    kind: information-requirement
    acquisition: { kind: single, source: cra-pension }
    purposes: [pension-payment-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/social-insurance/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/cra-death-status/v1
    validitySeconds: 300
    derivation: { script: derivations/deceased.rhai, parameters: {} }
    concepts: [{ id: https://id.registrystack.org/solmara/concept/person-is-deceased, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/pension.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/cra-pension] }
    existenceDisclosure: collapse-unresolved
  - id: https://id.registrystack.org/solmara/requirement/cra-citizen-record/v1
    kind: information-requirement
    acquisition: { kind: single, source: cra-citizen }
    purposes: [citizen-self-service]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/citizen-self-service/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/civil-record-linked/v1
    validitySeconds: 300
    derivation: { script: derivations/linked.rhai, parameters: {} }
    concepts: [{ id: https://id.registrystack.org/solmara/concept/civil-record-linked, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/citizen.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/cra-citizen] }
    existenceDisclosure: collapse-unresolved
