version: 1
assuranceProfile: production
service: { providerId: https://id.registrystack.org/solmara/evidence/nagdi, trustDomain: https://id.registrystack.org/solmara/trust-domain/lab }
issuer: { id: did:web:id.registrystack.org:solmara:authority:nagdi }
authentication: { kind: oidc-access-token, issuer: https://mint.solmara.registrystack.org, audiences: [solmara-runtime], tokenTypes: [at+jwt], algorithms: [ES256], jwksUri: https://mint.solmara.registrystack.org/.well-known/jwks.json, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, grantIdClaim: evidence_grant_id, grantAuthorityClaim: evidence_authority, maximumTokenLifetimeSeconds: 300, revokedKeyIds: [] }
audit: { format: keyed-jsonl, hashSecretRef: secret:file/audit-hmac-key, hashKeyVersion: 1, failClosed: true }
subjectBinding: { secretRef: secret:file/subject-binding-hmac-key, keyVersion: 1 }
rateLimits: { requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10 }
signing: { format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/nagdi.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 300, verifierClockSkewSeconds: 30 }
responseFormats: [signed-jws]
selectorProfiles: { farmer-reference-v1: { maximumAggregateBytes: 32, fields: { farmer_id: { type: string, minimumBytes: 7, maximumBytes: 16 } } } }
sources:
  nagdi-voucher:
    transport: http-json
    baseUrl: https://nagdi-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/nagdi-voucher-evidence-client-id, clientAssertionKeyRef: secret:file/nagdi-voucher-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:nagdi:voucher-by-farmer-id', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: &relay-unresolved { status: 404, type: https://id.registrystack.org/problems/registry-relay/consultation/unresolved, code: consultation.unresolved }
    request:
      method: POST
      path: /v2/resources/farmer/lookups/voucher-by-farmer-id
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: farmer-reference-v1, fields: [farmer_id] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: 'farmerRegistered,dataUseAuthorized,activeSmallholderFarmer,activeFarmParcel,cropDeclaredForSeason,districtClimateRiskActive,voucherEntitlementCurrent,voucherNotRedeemed' }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 512, maximumNormalizedBytes: 2048 }
      projection: [/data/domainData/farmerRegistered, /data/domainData/dataUseAuthorized, /data/domainData/activeSmallholderFarmer, /data/domainData/activeFarmParcel, /data/domainData/cropDeclaredForSeason, /data/domainData/districtClimateRiskActive, /data/domainData/voucherEntitlementCurrent, /data/domainData/voucherNotRedeemed]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/voucher-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/voucher-facts.schema.yaml
  nagdi-livestock:
    transport: http-json
    baseUrl: https://nagdi-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/nagdi-livestock-evidence-client-id, clientAssertionKeyRef: secret:file/nagdi-livestock-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:nagdi:movement-by-farmer-id', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: *relay-unresolved
    request:
      method: POST
      path: /v2/resources/livestock-herd/lookups/movement-by-farmer-id
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: farmer-reference-v1, fields: [farmer_id] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: 'registeredHerd,herdVaccinationCurrent,originDistrictNotQuarantinedForSpecies,destinationDistrictOpen,noConflictingOpenMovementPermit' }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 512, maximumNormalizedBytes: 2048 }
      projection: [/data/domainData/registeredHerd, /data/domainData/herdVaccinationCurrent, /data/domainData/originDistrictNotQuarantinedForSpecies, /data/domainData/destinationDistrictOpen, /data/domainData/noConflictingOpenMovementPermit]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/livestock-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/livestock-facts.schema.yaml
authorityProfiles:
  nagdi-consumers-v1:
    kind: statutory
    requesterTags: [solmara-demo]
    grants:
      - { requirement: https://id.registrystack.org/solmara/requirement/nagdi-voucher/v1, purpose: voucher-eligibility-review, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: farmer-reference-v1, valueOrigin: request }] }
      - { requirement: https://id.registrystack.org/solmara/requirement/nagdi-livestock/v1, purpose: livestock-movement-control, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: farmer-reference-v1, valueOrigin: request }] }
requirements:
  - id: https://id.registrystack.org/solmara/requirement/nagdi-voucher/v1
    kind: information-requirement
    acquisition: { kind: single, source: nagdi-voucher }
    purposes: [voucher-eligibility-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [farmer-reference-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/agriculture/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/climate-smart-voucher/v1
    validitySeconds: 300
    derivation: { script: derivations/voucher.rhai, parameters: {} }
    concepts: [{ id: https://id.registrystack.org/solmara/concept/farmer-registered, form: boolean, required: true, constraints: {} }, { id: https://id.registrystack.org/solmara/concept/data-use-authorized-for-purpose, form: boolean, required: true, constraints: {} }, { id: https://id.registrystack.org/solmara/concept/eligible-for-climate-smart-input-voucher, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/voucher.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/nagdi-voucher] }
    existenceDisclosure: collapse-unresolved
  - id: https://id.registrystack.org/solmara/requirement/nagdi-livestock/v1
    kind: information-requirement
    acquisition: { kind: single, source: nagdi-livestock }
    purposes: [livestock-movement-control]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [farmer-reference-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/agriculture/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/livestock-movement/v1
    validitySeconds: 300
    derivation: { script: derivations/livestock.rhai, parameters: {} }
    concepts: [{ id: https://id.registrystack.org/solmara/concept/registered-herd, form: boolean, required: true, constraints: {} }, { id: https://id.registrystack.org/solmara/concept/origin-district-not-quarantined-for-species, form: boolean, required: true, constraints: {} }, { id: https://id.registrystack.org/solmara/concept/eligible-for-livestock-movement-permit, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/livestock.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/nagdi-livestock] }
    existenceDisclosure: collapse-unresolved
