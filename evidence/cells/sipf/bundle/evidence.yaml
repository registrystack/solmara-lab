version: 1
assuranceProfile: production
service: { providerId: https://id.registrystack.org/solmara/evidence/sipf, trustDomain: https://id.registrystack.org/solmara/trust-domain/lab, publicOrigin: https://sipf-evidence.solmara.registrystack.org }
issuer: { id: did:web:id.registrystack.org:solmara:authority:sipf }
authentication: { kind: oidc-access-token, issuer: https://mint.solmara.registrystack.org, audiences: [solmara-runtime], tokenTypes: [at+jwt], algorithms: [ES256], jwksUri: https://mint.solmara.registrystack.org/.well-known/jwks.json, principalClaim: sub, requesterTagsClaim: evidence_tags, evidenceAudienceClaim: evidence_audience, grantIdClaim: evidence_grant_id, grantAuthorityClaim: evidence_authority, maximumTokenLifetimeSeconds: 300, revokedKeyIds: [] }
audit: { format: keyed-jsonl, hashSecretRef: secret:file/audit-hmac-key, hashKeyVersion: 1, failClosed: true }
subjectBinding: { secretRef: secret:file/subject-binding-hmac-key, keyVersion: 1 }
rateLimits: { requestsPerPrincipalPerMinute: 60, burstPerPrincipal: 10, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10 }
signing: { format: flattened-jws-json, algorithm: ES256, activePublicJwkFile: public-keys/sipf.jwk.json, publishedPublicJwkFiles: [], revokedKeyIds: [], jwksPath: /.well-known/evidence/jwks.json, maximumAssertionValiditySeconds: 300, verifierClockSkewSeconds: 30 }
responseFormats: [signed-jws]
selectorProfiles: { solmara-uin-v1: { maximumAggregateBytes: 16, fields: { uin: { type: string, minimumBytes: 10, maximumBytes: 10 } } } }
sources:
  sipf-pension:
    transport: http-json
    baseUrl: https://sipf-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/sipf-pension-evidence-client-id, clientAssertionKeyRef: secret:file/sipf-pension-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:sipf:by-pensioner-uin', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: &relay-unresolved { status: 404, type: https://id.registrystack.org/problems/registry-relay/consultation/unresolved, code: consultation.unresolved }
    request:
      method: POST
      path: /v2/resources/pension-payment/lookups/by-pensioner-uin
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: paymentStatus, selectorField: pensionerUin }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 64, maximumNormalizedBytes: 1024 }
      projection: [/data/domainData/paymentStatus]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/pension-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/pension-facts.schema.yaml
  sipf-survivor:
    transport: http-json
    baseUrl: https://sipf-relay.solmara.registrystack.org
    posture: field-projected
    authentication: { kind: oauth2-client-credentials, tokenEndpoint: https://mint.solmara.registrystack.org/token, clientIdRef: secret:file/sipf-survivor-evidence-client-id, clientAssertionKeyRef: secret:file/sipf-survivor-evidence-client-key, clientAssertionAudience: https://mint.solmara.registrystack.org/token, scope: 'solmara:relay:sipf:by-spouse-uin', audience: solmara-runtime, maximumCacheSeconds: 60 }
    unresolvedProblem: *relay-unresolved
    request:
      method: POST
      path: /v2/resources/survivor-case/lookups/by-spouse-uin
      fixedHeaders: [{ name: Accept, value: application/json }]
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      prepareScript: adapters/relay-prepare.rhai
      adapterParameters: { fields: survivorEligible, selectorField: spouseUin }
      adapterParametersSchema: schemas/relay-adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: required, maximumQueryPairs: 1, maximumQueryNameBytes: 16, maximumQueryValueBytes: 64, maximumNormalizedBytes: 1024 }
      projection: [/data/domainData/survivorEligible]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/survivor-response.schema.yaml
    extractScript: adapters/relay-extract.rhai
    factSchema: schemas/survivor-facts.schema.yaml
authorityProfiles:
  sipf-consumers-v1:
    kind: statutory
    requesterTags: [solmara-demo]
    grants:
      - { requirement: https://id.registrystack.org/solmara/requirement/sipf-pension-payment/v1, purpose: pension-payment-review, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
      - { requirement: https://id.registrystack.org/solmara/requirement/sipf-survivor-benefit/v1, purpose: survivor-benefit-determination, audienceFrom: authenticated-requester, responseFormats: [signed-jws], subjects: [{ role: subject, selectorProfile: solmara-uin-v1, valueOrigin: request }] }
requirements:
  - handle: sipf-pension-payment
    id: https://id.registrystack.org/solmara/requirement/sipf-pension-payment/v1
    kind: information-requirement
    acquisition: { kind: single, source: sipf-pension }
    purposes: [pension-payment-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/social-insurance/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/pension-payment-active/v1
    validitySeconds: 300
    derivation: { script: derivations/pension-active.rhai, parameters: {} }
    concepts: [{ handle: pension-payment-active, id: https://id.registrystack.org/solmara/concept/pension-payment-active, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/pension.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/sipf-pension] }
    existenceDisclosure: collapse-unresolved
  - handle: sipf-survivor-benefit
    id: https://id.registrystack.org/solmara/requirement/sipf-survivor-benefit/v1
    kind: information-requirement
    acquisition: { kind: single, source: sipf-survivor }
    purposes: [survivor-benefit-determination]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/social-insurance/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/survivor-benefit/v1
    validitySeconds: 300
    derivation: { script: derivations/survivor-eligible.rhai, parameters: {} }
    concepts: [{ handle: survivor-is-eligible, id: https://id.registrystack.org/solmara/concept/survivor-is-eligible, form: boolean, required: true, constraints: {} }]
    fixtures: fixtures/survivor.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/sipf-survivor] }
    existenceDisclosure: collapse-unresolved
