    kind: information-requirement
    source: cra-child-benefit
    purposes: [child-benefit-review]
    subjectRoles: [{ role: subject, cardinality: one, selectorProfiles: [solmara-uin-v1] }]
    referenceFrameworks: [https://id.registrystack.org/solmara/framework/child-benefit/v1]
    evidenceType: https://id.registrystack.org/solmara/evidence-type/cra-child-benefit/v1
    observationTimezone: Asia/Bangkok
    validitySeconds: 86400
    derivation:
      script: derivations/cra-child-benefit.rhai
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      parameters: { as_of_date: "2026-07-14" }
    concepts:
      - { id: https://id.registrystack.org/solmara/concept/birth-is-registered, form: boolean, required: true, constraints: {} }
      - { id: https://id.registrystack.org/solmara/concept/child-age-under-5, form: boolean, required: true, constraints: {} }
    fixtures: fixtures/cra-child-benefit.yaml
    disclosureGuard: { families: [https://id.registrystack.org/solmara/disclosure-family/cra-child-benefit] }
