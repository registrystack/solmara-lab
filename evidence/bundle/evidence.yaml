version: 1
assuranceProfile: production
service: { providerId: https://id.registrystack.org/solmara/evidence/national, trustDomain: https://id.registrystack.org/solmara/trust-domain/lab }
issuer: { id: https://id.registrystack.org/solmara/issuer/national-evidence-service }
authentication:
  kind: oidc-access-token
  issuer: https://mint.evidence.solmara.invalid
  audiences: [solmara-evidence]
  tokenTypes: [at+jwt]
  algorithms: [EdDSA]
  jwksUri: https://mint.evidence.solmara.invalid/.well-known/jwks.json
  principalClaim: sub
  requesterTagsClaim: evidence_tags
  evidenceAudienceClaim: evidence_audience
  grantIdClaim: evidence_grant_id
  grantAuthorityClaim: evidence_authority
audit: { format: keyed-jsonl, hashSecretRef: secret:file/audit-hmac-key, hashKeyVersion: 1, failClosed: true }
subjectBinding: { secretRef: secret:file/subject-binding-hmac-key, keyVersion: 1 }
# One demo principal drives every guided workflow, so its burst covers a full
# end-to-end lab tour while retaining per-principal and selector-failure bounds.
rateLimits: { requestsPerPrincipalPerMinute: 600, burstPerPrincipal: 100, failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 50 }
signing:
  format: flattened-jws-json
  algorithm: EdDSA
  activeKeyId: solmara-evidence-signing-key-1
  activeKeyRef: secret:file/signing-ed25519-private-jwk
  retiredPublicJwkFiles: []
  jwksPath: /.well-known/evidence/jwks.json
  maximumAssertionValiditySeconds: 86400
  verifierClockSkewSeconds: 30
responseFormats: [signed-jws]

selectorProfiles:
  solmara-uin-v1:
    maximumAggregateBytes: 16
    fields:
      uin: { type: string, minimumBytes: 10, maximumBytes: 10 }
  farmer-reference-v1:
    maximumAggregateBytes: 32
    fields:
      farmer_id: { type: string, minimumBytes: 7, maximumBytes: 16 }

sources:
  cra-child-benefit:
    transport: http-json
    baseUrl: https://cra-relay.evidence.solmara.invalid
    tlsTrustProfile: solmara-lab
    posture: field-projected
    authentication: { kind: static-bearer, tokenRef: secret:file/cra-relay-token }
    request:
      method: GET
      path: /v1/datasets/civil_people/entities/civil_people/records
      fixedHeaders:
        - { name: Accept, value: application/json }
        - { name: Data-Purpose, value: https://id.registrystack.org/solmara/purpose/child-benefit-review }
      selectorInputs: [{ role: subject, alternatives: [{ profile: solmara-uin-v1, fields: [uin] }] }]
      prepareScript: adapters/prepare.rhai
      adapterParameters: { selectorField: uin, providerFields: "uin,birth_date,birth_brn,deceased", resultLimit: "2" }
      adapterParametersSchema: schemas/adapter-parameters.schema.yaml
      preparationLimits: { query: required, jsonBody: forbidden, maximumQueryPairs: 8, maximumQueryNameBytes: 64, maximumQueryValueBytes: 1024, maximumNormalizedBytes: 4096 }
      projection: [/data/*/uin, /data/*/birth_date, /data/*/birth_brn, /data/*/deceased, /pagination/has_more]
      redirects: deny
      timeoutMilliseconds: 3000
      maximumResponseBytes: 65536
      concurrencyLimit: 8
    responseSchema: schemas/response.schema.yaml
    extractScript: adapters/extract.rhai
    factSchema: schemas/cra-child-benefit-facts.schema.yaml
