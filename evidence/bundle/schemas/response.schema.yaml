type: object
additionalProperties: false
required: [data, pagination]
properties:
  data:
    type: array
    minItems: 0
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      required: []
      properties:
        uin: { type: string, minLength: 10, maxLength: 10 }
        pensioner_uin: { type: string, minLength: 10, maxLength: 10 }
        spouse_uin: { type: string, minLength: 10, maxLength: 10 }
        farmer_id: { type: string, minLength: 7, maxLength: 16 }
        birth_date: { type: string, format: date, maxLength: 10 }
        birth_brn: { type: [string, "null"], maxLength: 32 }
        deceased: { type: boolean }
        identity_status: { type: string, maxLength: 32 }
        alive: { type: boolean }
        poverty_band: { type: string, maxLength: 16 }
        duplicate_flag: { type: boolean }
        payment_status: { type: string, maxLength: 32 }
        survivor_eligible: { type: boolean }
        farmer_registered: { type: boolean }
        data_use_authorized: { type: boolean }
        active_smallholder_farmer: { type: boolean }
        active_farm_parcel: { type: boolean }
        crop_declared_for_season: { type: boolean }
        district_climate_risk_active: { type: boolean }
        voucher_entitlement_current: { type: boolean }
        voucher_not_redeemed: { type: boolean }
        registered_herd: { type: boolean }
        herd_vaccination_current: { type: boolean }
        origin_district_not_quarantined_for_species: { type: boolean }
        destination_district_open: { type: boolean }
        no_conflicting_open_movement_permit: { type: boolean }
  pagination:
    type: object
    additionalProperties: false
    required: [has_more]
    properties:
      has_more: { type: boolean }
