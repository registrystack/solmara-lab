version: 1
bundleDirectory: /etc/registry-evidence/bundle
listener:
  bindHost: 172.29.0.10
  port: 8080
  tlsTermination: operator-controlled-upstream
  trustProxyIdentityHeaders: false
  maximumRequestBytes: 65536
  maximumConcurrentRequests: 64
  requestTimeoutMilliseconds: 10000
  shutdownGraceMilliseconds: 30000
secretProviders:
  file:
    root: /run/secrets/registry-evidence
signer:
  kind: local-jwk
  privateKeyRef: secret:file/signing-p256-private-jwk
auditStorage:
  path: /var/lib/registry-evidence/audit/evidence.jsonl
  maximumFileBytes: 1073741824
outboundTls:
  systemRoots: true
  trustProfiles:
    solmara-lab:
      caBundleFile: /etc/registry-evidence/tls/lab-ca.crt
