audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  sink: stdout
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: false
    allowed_clients: []
    audiences:
    - registry-relay
    issuer: https://workload-issuer.solmara.registrystack.org
    jwks_url: https://workload-issuer.solmara.registrystack.org/.well-known/jwks.json
catalog:
  base_url: https://sipf-relay.solmara.registrystack.org
  publisher: solmara-sipf-pensions
  title: solmara-sipf-pensions governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized pension entity
  entities: []
  id: pension
  owner: solmara-sipf-pensions
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: pension:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_e378f482aa5f7ec6ca19d81f76802de996046719bcf2976f033a9ff5c8dedd21
    materialization: snapshot
    primary_key: pensioner_uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: payment_status
        nullable: false
        sensitive: true
        type: string
      - name: pensioner_uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      connection_env: SOLMARA_SIPF_DATABASE_URL
      table:
        name: sipf_pension_payment
        schema: public
      type: postgres
  title: pension
  update_frequency: as_needed
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized survivor entity
  entities: []
  id: survivor
  owner: solmara-sipf-pensions
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: survivor:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_c346e9a9e571c9cff9cc50780a950c7e58e5cd048091b530157c5cb540d9d539
    materialization: snapshot
    primary_key: spouse_uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: spouse_uin
        nullable: false
        sensitive: true
        type: string
      - name: survivor_eligible
        nullable: false
        sensitive: true
        type: boolean
      strict: true
    source:
      connection_env: SOLMARA_SIPF_DATABASE_URL
      table:
        name: sipf_survivor_benefit
        schema: public
      type: postgres
  title: survivor
  update_frequency: as_needed
deployment:
  profile: hosted_lab
instance:
  environment: hosted
  id: sipf-pensions-relay
server:
  bind: 127.0.0.1:8080
standards: {}
