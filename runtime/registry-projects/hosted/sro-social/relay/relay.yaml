audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  path: /var/lib/registry/audit/audit.jsonl
  sink: file
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: false
    allowed_clients:
    - solmara-evidence
    audiences:
    - registry-relay
    issuer: https://workload-issuer.solmara.registrystack.org
    jwks_url: https://workload-issuer.solmara.registrystack.org/.well-known/jwks.json
catalog:
  base_url: https://sro-relay.solmara.registrystack.org
  publisher: solmara-sro-social
  title: solmara-sro-social governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Purpose-limited household facts used by the Solmara Evidence service.
  entities:
  - access:
      aggregate_scope: sro_child:aggregate
      evidence_verification_scope: sro_child:evidence_verification
      metadata_scope: sro_child:metadata
      read_scope: sro_child:rows
    aggregates: []
    api:
      allowed_expansions: []
      allowed_filters:
      - field: uin
        ops:
        - eq
      default_limit: 2
      governed_policy:
        allowed_assurance: []
        permitted_jurisdictions: []
        permitted_purposes:
        - https://id.registrystack.org/solmara/purpose/child-benefit-review
        redaction_fields: []
        require_consent: false
        require_legal_basis: false
        trusted_context: {}
      max_limit: 2
      require_purpose_header: true
      required_filter_bindings: []
      required_filters: []
    attribute_release_profiles: []
    description: Purpose-limited household facts used by the Solmara Evidence service.
    fields:
    - from: poverty_band
      name: poverty_band
      sensitive: true
    - from: uin
      name: uin
      sensitive: true
    name: sro_child
    relationships: []
    spatial: null
    table: materialization_a2fcdd986475cdde3629a2c14184c4d678c8f6a99ae777f97831bc4ffbcb540d
    title: SRO household records
  id: sro_child
  owner: Social Registry Office
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: sro_child:aggregate
      metadata_scope: sro_child:metadata
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 2
      max_limit: 2
      require_purpose_header: true
    id: materialization_a2fcdd986475cdde3629a2c14184c4d678c8f6a99ae777f97831bc4ffbcb540d
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: poverty_band
        nullable: false
        sensitive: true
        type: string
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/social-development/fixtures/child_benefit_household.csv
      type: file
  title: SRO household records
  update_frequency: continuous
deployment:
  profile: hosted_lab
instance:
  environment: hosted
  id: sro-social-relay
server:
  bind: 0.0.0.0:8080
standards: {}
