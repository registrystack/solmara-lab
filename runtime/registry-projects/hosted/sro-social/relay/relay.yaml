audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  sink: stdout
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: false
    allowed_clients:
    - sro-notary
    audiences:
    - registry-relay
    issuer: https://workload-issuer.solmara.registrystack.org
    jwks_url: https://workload-issuer.solmara.registrystack.org/.well-known/jwks.json
catalog:
  base_url: https://sro-relay.solmara.registrystack.org
  publisher: solmara-sro-social
  title: solmara-sro-social governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized sro_child entity
  entities: []
  id: sro_child
  owner: solmara-sro-social
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: sro_child:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_a2fcdd986475cdde3629a2c14184c4d678c8f6a99ae777f97831bc4ffbcb540d
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: poverty_band
        nullable: false
        sensitive: true
        type: string
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/social-development/fixtures/child_benefit_household.csv
      type: file
  title: sro_child
  update_frequency: as_needed
deployment:
  profile: hosted_lab
instance:
  environment: hosted
  id: sro-social-relay
server:
  bind: 127.0.0.1:8080
standards: {}
