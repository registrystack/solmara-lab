audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  path: /var/lib/registry/audit/audit.jsonl
  sink: file
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: true
    allowed_clients:
    - solmara-evidence
    audiences:
    - registry-relay
    issuer: http://127.0.0.1:8090
    jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
catalog:
  base_url: http://127.0.0.1:8080
  publisher: solmara-sipf-pensions
  title: solmara-sipf-pensions governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Purpose-limited pension facts used by the Solmara Evidence service.
  entities:
  - access:
      aggregate_scope: pension:aggregate
      evidence_verification_scope: pension:evidence_verification
      metadata_scope: pension:metadata
      read_scope: pension:rows
    aggregates: []
    api:
      allowed_expansions: []
      allowed_filters:
      - field: pensioner_uin
        ops:
        - eq
      default_limit: 2
      governed_policy:
        allowed_assurance: []
        permitted_jurisdictions: []
        permitted_purposes:
        - https://id.registrystack.org/solmara/purpose/pension-payment-review
        redaction_fields: []
        require_consent: false
        require_legal_basis: false
        trusted_context: {}
      max_limit: 2
      require_purpose_header: true
      required_filter_bindings: []
      required_filters: []
    attribute_release_profiles: []
    description: Purpose-limited pension facts used by the Solmara Evidence service.
    fields:
    - from: payment_status
      name: payment_status
      sensitive: true
    - from: pensioner_uin
      name: pensioner_uin
      sensitive: true
    name: pension
    relationships: []
    spatial: null
    table: materialization_e378f482aa5f7ec6ca19d81f76802de996046719bcf2976f033a9ff5c8dedd21
    title: SIPF pension payment records
  id: pension
  owner: Social Insurance and Pension Fund
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: pension:aggregate
      metadata_scope: pension:metadata
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 2
      max_limit: 2
      require_purpose_header: true
    id: materialization_e378f482aa5f7ec6ca19d81f76802de996046719bcf2976f033a9ff5c8dedd21
    materialization: snapshot
    primary_key: pensioner_uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: payment_status
        nullable: false
        sensitive: true
        type: string
      - name: pensioner_uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      connection_env: SOLMARA_SIPF_DATABASE_URL
      table:
        name: sipf_pension_payment
        schema: public
      type: postgres
  title: SIPF pension payment records
  update_frequency: continuous
