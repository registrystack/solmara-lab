audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  sink: stdout
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: true
    allowed_clients:
    - programme-notary
    audiences:
    - registry-relay
    issuer: http://127.0.0.1:8090
    jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
catalog:
  base_url: http://127.0.0.1:8080
  publisher: solmara-mosd-programme
  title: solmara-mosd-programme governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized mosd_enroll entity
  entities: []
  id: mosd_enroll
  owner: solmara-mosd-programme
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: mosd_enroll:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_5f676d9c112ce16b7ede827eab122868889c2a4c9a1d4b38a214beecadc245bf
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: duplicate_flag
        nullable: false
        sensitive: true
        type: boolean
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/social-development/fixtures/programme_mis_enrollment.csv
      type: file
  title: mosd_enroll
  update_frequency: as_needed
deployment:
  profile: local
instance:
  environment: local
  id: programme-mis-relay
server:
  bind: 127.0.0.1:8080
standards: {}
