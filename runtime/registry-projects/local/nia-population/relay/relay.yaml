audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  path: /var/lib/registry/audit/audit.jsonl
  sink: file
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: true
    allowed_clients:
    - solmara-esignet
    - solmara-evidence
    audiences:
    - registry-relay
    issuer: http://127.0.0.1:8090
    jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
catalog:
  base_url: http://127.0.0.1:8080
  publisher: solmara-nia-population
  title: solmara-nia-population governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Governed population attributes used by NIA-owned services.
  entities:
  - access:
      aggregate_scope: population:aggregate
      evidence_verification_scope: population:evidence_verification
      metadata_scope: population:metadata
      read_scope: population:rows
    aggregates: []
    api:
      allowed_expansions: []
      allowed_filters:
      - field: legacy_nid
        ops:
        - eq
      - field: uin
        ops:
        - eq
      default_limit: 25
      governed_policy:
        allowed_assurance: []
        permitted_jurisdictions: []
        permitted_purposes:
        - https://id.registrystack.org/solmara/purpose/esignet-identity-verification
        - https://id.registrystack.org/solmara/purpose/child-benefit-review
        - https://id.registrystack.org/solmara/purpose/citizen-self-service
        redaction_fields: []
        require_consent: false
        require_legal_basis: false
        trusted_context: {}
      max_limit: 100
      require_purpose_header: true
      required_filter_bindings: []
      required_filters: []
    attribute_release_profiles:
    - claims:
      - expression: null
        name: birthdate
        required: true
        sensitivity: personal
        source_field: birth_date
      - expression: null
        name: family_name
        required: true
        sensitivity: direct_identifier
        source_field: family_name
      - expression: null
        name: gender
        required: false
        sensitivity: personal
        source_field: sex
      - expression: null
        name: given_name
        required: true
        sensitivity: direct_identifier
        source_field: given_name
      - expression: null
        name: individual_id
        required: true
        sensitivity: direct_identifier
        source_field: uin
      - expression:
          cel: source.given_name + ' ' + source.family_name
        name: name
        required: true
        sensitivity: direct_identifier
        source_field: null
      description: Minimal identity attributes for the Solmara eSignet authenticator.
      id: solmara-nia-userinfo
      purpose: https://id.registrystack.org/solmara/purpose/esignet-identity-verification
      release_conditions:
        expression:
          cel: source.identity_status == 'active' && source.alive == true
      release_scope: population:identity_release
      subject:
        id_type: national_id
        source_field: uin
      title: SolmaraID UserInfo
      version: v1
    description: Governed population attributes used by NIA-owned services.
    fields:
    - from: alive
      name: alive
      sensitive: true
    - from: birth_date
      name: birth_date
      sensitive: true
    - from: family_name
      name: family_name
      sensitive: true
    - from: given_name
      name: given_name
      sensitive: true
    - from: identity_status
      name: identity_status
      sensitive: true
    - from: legacy_nid
      name: legacy_nid
      sensitive: true
    - from: sex
      name: sex
      sensitive: true
    - from: uin
      name: uin
      sensitive: true
    name: population
    relationships: []
    spatial: null
    table: materialization_aae79577068250722b57ed81fc12d038a35dc36e179ee2d7efb168fd9942f05d
    title: NIA population records
  id: population
  owner: National Identity Agency
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: population:aggregate
      metadata_scope: population:metadata
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 25
      max_limit: 100
      require_purpose_header: true
    id: materialization_aae79577068250722b57ed81fc12d038a35dc36e179ee2d7efb168fd9942f05d
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: alive
        nullable: false
        sensitive: true
        type: boolean
      - name: birth_date
        nullable: false
        sensitive: true
        type: date
      - name: family_name
        nullable: false
        sensitive: true
        type: string
      - name: given_name
        nullable: false
        sensitive: true
        type: string
      - name: identity_status
        nullable: false
        sensitive: true
        type: string
      - name: legacy_nid
        nullable: true
        sensitive: true
        type: string
      - name: sex
        nullable: false
        sensitive: true
        type: string
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      connection_env: SOLMARA_NIA_DATABASE_URL
      table:
        name: population_person
        schema: public
      type: postgres
  title: NIA population records
  update_frequency: continuous
deployment:
  profile: local
instance:
  environment: local
  id: nia-population-relay
server:
  bind: 0.0.0.0:8080
standards: {}
