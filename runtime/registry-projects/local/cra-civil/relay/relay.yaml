audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  path: /var/lib/registry/audit/audit.jsonl
  sink: file
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: true
    allowed_clients:
    - solmara-evidence
    audiences:
    - registry-relay
    issuer: http://127.0.0.1:8090
    jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
catalog:
  base_url: http://127.0.0.1:8080
  publisher: solmara-cra-civil
  title: solmara-cra-civil governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Purpose-limited civil facts used by the Solmara Evidence service.
  entities:
  - access:
      aggregate_scope: civil_people:aggregate
      evidence_verification_scope: civil_people:evidence_verification
      metadata_scope: civil_people:metadata
      read_scope: civil_people:rows
    aggregates: []
    api:
      allowed_expansions: []
      allowed_filters:
      - field: uin
        ops:
        - eq
      default_limit: 2
      governed_policy:
        allowed_assurance: []
        permitted_jurisdictions: []
        permitted_purposes:
        - https://id.registrystack.org/solmara/purpose/child-benefit-review
        - https://id.registrystack.org/solmara/purpose/pension-payment-review
        - https://id.registrystack.org/solmara/purpose/citizen-self-service
        redaction_fields: []
        require_consent: false
        require_legal_basis: false
        trusted_context: {}
      max_limit: 2
      require_purpose_header: true
      required_filter_bindings: []
      required_filters: []
    attribute_release_profiles: []
    description: Purpose-limited civil facts used by the Solmara Evidence service.
    fields:
    - from: birth_brn
      name: birth_brn
      sensitive: true
    - from: birth_date
      name: birth_date
      sensitive: true
    - from: deceased
      name: deceased
      sensitive: true
    - from: uin
      name: uin
      sensitive: true
    name: civil_people
    relationships: []
    spatial: null
    table: materialization_f5d795774cce29f1dfb681aae7844653315f52188d39b841602bb758e7e53382
    title: CRA civil records
  id: civil_people
  owner: Civil Registration Authority
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: civil_people:aggregate
      metadata_scope: civil_people:metadata
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 2
      max_limit: 2
      require_purpose_header: true
    id: materialization_f5d795774cce29f1dfb681aae7844653315f52188d39b841602bb758e7e53382
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: birth_brn
        nullable: true
        sensitive: true
        type: string
      - name: birth_date
        nullable: false
        sensitive: true
        type: date
      - name: deceased
        nullable: false
        sensitive: true
        type: boolean
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/interior-civil/fixtures/civil_person_projection.csv
      type: file
  title: CRA civil records
  update_frequency: continuous
deployment:
  profile: local
instance:
  environment: local
  id: cra-civil-relay
server:
  bind: 0.0.0.0:8080
standards: {}
