audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  sink: stdout
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: true
    allowed_clients:
    - nagdi-notary
    audiences:
    - registry-relay
    issuer: http://127.0.0.1:8090
    jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
catalog:
  base_url: http://127.0.0.1:8080
  publisher: solmara-nagdi-agriculture
  title: solmara-nagdi-agriculture governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized nagdi_farmer entity
  entities: []
  id: nagdi_farmer
  owner: solmara-nagdi-agriculture
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: nagdi_farmer:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_a5df746e609cc2000dcc08b086dce4fbd407a4908364552aa2ea32be9d99c6f7
    materialization: snapshot
    primary_key: farmer_id
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: active_farm_parcel
        nullable: false
        sensitive: true
        type: boolean
      - name: active_smallholder_farmer
        nullable: false
        sensitive: true
        type: boolean
      - name: crop_declared_for_season
        nullable: false
        sensitive: true
        type: boolean
      - name: data_use_authorized
        nullable: false
        sensitive: true
        type: boolean
      - name: district_climate_risk_active
        nullable: false
        sensitive: true
        type: boolean
      - name: farmer_id
        nullable: false
        sensitive: true
        type: string
      - name: farmer_registered
        nullable: false
        sensitive: true
        type: boolean
      - name: voucher_entitlement_current
        nullable: false
        sensitive: true
        type: boolean
      - name: voucher_not_redeemed
        nullable: false
        sensitive: true
        type: boolean
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/agriculture-nagdi/fixtures/farmer_voucher.csv
      type: file
  title: nagdi_farmer
  update_frequency: as_needed
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized nagdi_herd entity
  entities: []
  id: nagdi_herd
  owner: solmara-nagdi-agriculture
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: nagdi_herd:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_c530010904da8a151e2b3437cbb64d2c54dcbc140b0fcf9d6331e97e73063e9b
    materialization: snapshot
    primary_key: herd_id
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: destination_district_open
        nullable: false
        sensitive: true
        type: boolean
      - name: farmer_id
        nullable: false
        sensitive: true
        type: string
      - name: herd_id
        nullable: false
        sensitive: true
        type: string
      - name: herd_vaccination_current
        nullable: false
        sensitive: true
        type: boolean
      - name: no_conflicting_open_movement_permit
        nullable: false
        sensitive: true
        type: boolean
      - name: origin_district_not_quarantined_for_species
        nullable: false
        sensitive: true
        type: boolean
      - name: registered_herd
        nullable: false
        sensitive: true
        type: boolean
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/agriculture-nagdi/fixtures/livestock_movement.csv
      type: file
  title: nagdi_herd
  update_frequency: as_needed
deployment:
  profile: local
instance:
  environment: local
  id: nagdi-agriculture-relay
server:
  bind: 127.0.0.1:8080
standards: {}
