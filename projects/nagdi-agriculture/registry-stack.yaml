version: 1

registry:
  id: solmara-nagdi-agriculture

integrations:
  farmer-voucher-by-farmer:
    file: integrations/farmer-voucher-by-farmer/integration.yaml
  livestock-movement-by-farmer:
    file: integrations/livestock-movement-by-farmer/integration.yaml

entities:
  nagdi_farmer:
    file: entities/nagdi_farmer.yaml
  nagdi_herd:
    file: entities/nagdi_herd.yaml

services:
  nagdi-farmer-records:
    kind: records_api
    entity: nagdi_farmer
    title: NAgDI farmer records
    description: Purpose-limited farmer facts used by the Solmara Evidence service.
    owner: National Agriculture Data and Digital Innovation Agency
    sensitivity: personal
    access_rights: restricted
    update_frequency: continuous
    api:
      scopes:
        metadata: nagdi_farmer:metadata
        rows: nagdi_farmer:rows
        aggregate: nagdi_farmer:aggregate
        evidence_verification: nagdi_farmer:evidence_verification
      purposes:
        - https://id.registrystack.org/solmara/purpose/voucher-eligibility-review
      projection:
        - farmer_id
        - farmer_registered
        - data_use_authorized
        - active_smallholder_farmer
        - active_farm_parcel
        - crop_declared_for_season
        - district_climate_risk_active
        - voucher_entitlement_current
        - voucher_not_redeemed
      pagination: { default_limit: 2, max_limit: 2 }
      filters:
        farmer_id: [eq]
      standards: { ogc_features: false, sp_dci: false }

  nagdi-farmer-consultation:
    kind: consultation_api
    version: 1
    purpose: https://id.registrystack.org/solmara/purpose/voucher-eligibility-review
    legal_basis: agricultural-data-act
    consent: not_required
    consultations:
      farmer:
        integration: farmer-voucher-by-farmer
        input:
          farmer_id: request.target.identifiers.farmer_id

  nagdi-herd-consultation:
    kind: consultation_api
    version: 1
    purpose: https://id.registrystack.org/solmara/purpose/livestock-movement-control
    legal_basis: agricultural-data-act
    consent: not_required
    consultations:
      herd:
        integration: livestock-movement-by-farmer
        input:
          farmer_id: request.target.identifiers.farmer_id

  nagdi-herd-records:
    kind: records_api
    entity: nagdi_herd
    title: NAgDI herd records
    description: Purpose-limited herd facts used by the Solmara Evidence service.
    owner: National Agriculture Data and Digital Innovation Agency
    sensitivity: personal
    access_rights: restricted
    update_frequency: continuous
    api:
      scopes:
        metadata: nagdi_herd:metadata
        rows: nagdi_herd:rows
        aggregate: nagdi_herd:aggregate
        evidence_verification: nagdi_herd:evidence_verification
      purposes:
        - https://id.registrystack.org/solmara/purpose/livestock-movement-control
      projection:
        - herd_id
        - farmer_id
        - registered_herd
        - herd_vaccination_current
        - origin_district_not_quarantined_for_species
        - destination_district_open
        - no_conflicting_open_movement_permit
      pagination: { default_limit: 2, max_limit: 2 }
      filters:
        farmer_id: [eq]
      standards: { ogc_features: false, sp_dci: false }
