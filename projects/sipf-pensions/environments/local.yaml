version: 1
entities:
  pension:
    provider:
      type: postgres
      connection: { secret: SOLMARA_SIPF_DATABASE_URL }
      schema: public
      table: sipf_pension_payment
    columns:
      pensioner_uin: pensioner_uin
      payment_status: payment_status
    source_revision: sipf-pension-payment-projection-v1
    generation: 2026-07-14
  survivor:
    provider:
      type: postgres
      connection: { secret: SOLMARA_SIPF_DATABASE_URL }
      schema: public
      table: sipf_survivor_benefit
    columns:
      spouse_uin: spouse_uin
      survivor_eligible: survivor_eligible
    source_revision: sipf-survivor-benefit-projection-v1
    generation: 2026-07-14
relay:
  origin: http://127.0.0.1:8080
  issuer: http://127.0.0.1:8090
  jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
  audience: registry-relay
  allowed_clients: [solmara-evidence]
  consultation: { client_id: solmara-consultation, principal_id: solmara-consultation }
relay_state: { postgresql: { root_certificate_path: /etc/solmara/postgres/root.crt } }
deployment:
  profile: local
  relay: { service: sipf-pensions-relay }
