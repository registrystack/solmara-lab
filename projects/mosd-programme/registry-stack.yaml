version: 1

registry:
  id: solmara-mosd-programme

integrations:
  enrollment-by-uin:
    file: integrations/enrollment-by-uin/integration.yaml

entities:
  mosd_enroll:
    file: entities/mosd_enroll.yaml

services:
  mosd-enrollment-records:
    kind: records_api
    entity: mosd_enroll
    title: MOSD programme enrollment records
    description: Purpose-limited enrollment facts used by the Solmara Evidence service.
    owner: Ministry of Social Development
    sensitivity: personal
    access_rights: restricted
    update_frequency: continuous
    api:
      scopes:
        metadata: mosd_enroll:metadata
        rows: mosd_enroll:rows
        aggregate: mosd_enroll:aggregate
        evidence_verification: mosd_enroll:evidence_verification
      purposes:
        - https://id.registrystack.org/solmara/purpose/child-benefit-review
      projection: [uin, duplicate_flag]
      pagination: { default_limit: 2, max_limit: 2 }
      filters:
        uin: [eq]
      standards: { ogc_features: false, sp_dci: false }

  mosd-enrollment-consultation:
    kind: consultation_api
    version: 1
    purpose: https://id.registrystack.org/solmara/purpose/child-benefit-review
    legal_basis: child-benefit-act
    consent: not_required
    consultations:
      enrollment:
        integration: enrollment-by-uin
        input:
          uin: request.target.identifiers.solmara_uin
