version: 1

registry:
  id: solmara-cra-civil

integrations:
  civil-person-by-uin:
    file: integrations/civil-person-by-uin/integration.yaml

entities:
  civil_people:
    file: entities/civil_people.yaml

services:
  cra-civil-records:
    kind: records_api
    entity: civil_people
    title: CRA civil records
    description: Purpose-limited civil facts used by the Solmara Evidence service.
    owner: Civil Registration Authority
    sensitivity: personal
    access_rights: restricted
    update_frequency: continuous
    api:
      scopes:
        metadata: civil_people:metadata
        rows: civil_people:rows
        aggregate: civil_people:aggregate
        evidence_verification: civil_people:evidence_verification
      purposes:
        - https://id.registrystack.org/solmara/purpose/child-benefit-review
        - https://id.registrystack.org/solmara/purpose/pension-payment-review
        - https://id.registrystack.org/solmara/purpose/citizen-self-service
      projection: [uin, birth_date, birth_brn, deceased]
      pagination: { default_limit: 2, max_limit: 2 }
      filters:
        uin: [eq]
      standards: { ogc_features: false, sp_dci: false }

  cra-civil-consultation:
    kind: consultation_api
    version: 1
    purpose: https://id.registrystack.org/solmara/purpose/child-benefit-review
    legal_basis: child-benefit-act
    consent: not_required
    consultations:
      civil:
        integration: civil-person-by-uin
        input:
          uin: request.target.identifiers.solmara_uin
