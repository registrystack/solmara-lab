version: 1

entities:
  sro_child:
    provider:
      type: csv
      path: /var/lib/solmara/ministries/social-development/fixtures/child_benefit_household.csv
      header_row: 1
    columns:
      uin: uin
      poverty_band: poverty_band
    source_revision: solmara-sro-child-benefit-projection-v1
    generation: "2026-07-14"

relay:
  origin: http://127.0.0.1:8080
  issuer: http://127.0.0.1:8090
  jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
  audience: registry-relay
  allowed_clients: [solmara-evidence]
  consultation: { client_id: solmara-consultation, principal_id: solmara-consultation }
relay_state: { postgresql: { root_certificate_path: /etc/solmara/postgres/root.crt } }

deployment:
  profile: local
  relay: { service: sro-social-relay }
