version: 1
entities:
  population:
    provider:
      type: postgres
      connection: { secret: SOLMARA_NIA_DATABASE_URL }
      schema: public
      table: population_person
    columns:
      uin: uin
      legacy_nid: legacy_nid
      given_name: given_name
      family_name: family_name
      sex: sex
      birth_date: birth_date
      identity_status: identity_status
      alive: alive
    source_revision: nia-population-person-v1
    generation: 2026-07-14
relay:
  origin: http://127.0.0.1:8080
  issuer: http://127.0.0.1:8090
  jwks_url: http://127.0.0.1:8090/.well-known/jwks.json
  audience: registry-relay
  allowed_clients: [solmara-esignet, solmara-evidence]
  consultation: { client_id: solmara-consultation, principal_id: solmara-consultation }
relay_state: { postgresql: { root_certificate_path: /etc/solmara/postgres/root.crt } }
deployment:
  profile: local
  relay: { service: nia-population-relay }
