schema_version: registry-manifest/v1
catalog:
  id: solmara-authority-cells
  base_url: https://metadata.solmara.registrystack.org
  title:
    en: Solmara authority-owned Evidence catalogue
  description:
    en: Six authority-owned Evidence cells, five governed Relay V2 services, and the programme applications that compose signed assertions.
  publisher:
    name: Solmara Interoperability Metadata Publisher
    iri: did:web:id.registrystack.org:solmara:authority:metadata
    authority_type: eli:PublicAuthority
  participant_id: did:web:id.registrystack.org:solmara:authority:metadata
  application_profiles:
    - id: cpsv-ap
      version: 3.2.0
vocabularies:
  eli: http://data.europa.eu/eli/ontology#
  ps: https://publicschema.org/
  solmara: https://id.registrystack.org/solmara/
authorities:
  - id: cra
    iri: did:web:id.registrystack.org:solmara:authority:cra
    name: Civil Registration Authority
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
  - id: nia
    iri: did:web:id.registrystack.org:solmara:authority:nia
    name: National Identity Agency
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
  - id: sro
    iri: did:web:id.registrystack.org:solmara:authority:sro
    name: Social Registry Office
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
  - id: mosd-programme-mis
    iri: did:web:id.registrystack.org:solmara:authority:mosd-programme-mis
    name: Ministry of Social Development Programme MIS
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
  - id: sipf
    iri: did:web:id.registrystack.org:solmara:authority:sipf
    name: Social Insurance and Pensions Fund
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
  - id: nagdi
    iri: did:web:id.registrystack.org:solmara:authority:nagdi
    name: National Agricultural Data Institute
    authority_type: eli:PublicAuthority
    spatial: https://id.registrystack.org/solmara/jurisdiction/XS
requirements:
  - id: cra-child-benefit-v1
    iri: https://id.registrystack.org/solmara/requirement/cra-child-benefit/v1
    title: {en: CRA child benefit evidence}
    description: {en: Confirm registered birth and age under five from CRA's immutable birth extract.}
    evidence_type_lists:
      - id: cra-child-benefit-list
        title: {en: CRA child benefit evidence}
        evidence_types: [cra-child-benefit-v1]
  - id: cra-pension-death-v1
    iri: https://id.registrystack.org/solmara/requirement/cra-pension-death/v1
    title: {en: CRA pension death status}
    description: {en: Confirm death registration through CRA's governed Relay lookup.}
    evidence_type_lists:
      - id: cra-pension-death-list
        title: {en: CRA death-status evidence}
        evidence_types: [cra-death-status-v1]
  - id: cra-citizen-record-v1
    iri: https://id.registrystack.org/solmara/requirement/cra-citizen-record/v1
    title: {en: CRA citizen record link}
    description: {en: Confirm a linked civil record through CRA's governed Relay lookup.}
    evidence_type_lists:
      - id: cra-citizen-record-list
        title: {en: CRA civil-record evidence}
        evidence_types: [civil-record-linked-v1]
  - id: nia-child-benefit-v1
    iri: https://id.registrystack.org/solmara/requirement/nia-child-benefit/v1
    title: {en: NIA child benefit population status}
    description: {en: Confirm active population status from NIA's immutable population extract.}
    evidence_type_lists:
      - id: nia-child-benefit-list
        title: {en: NIA population evidence}
        evidence_types: [population-active-v1]
  - id: nia-citizen-status-v1
    iri: https://id.registrystack.org/solmara/requirement/nia-citizen-status/v1
    title: {en: NIA citizen population status}
    description: {en: Confirm active citizen population status from NIA's immutable population extract.}
    evidence_type_lists:
      - id: nia-citizen-status-list
        title: {en: NIA citizen-status evidence}
        evidence_types: [citizen-population-active-v1]
  - id: sro-child-benefit-v1
    iri: https://id.registrystack.org/solmara/requirement/sro-child-benefit/v1
    title: {en: SRO poverty priority}
    description: {en: Confirm household poverty priority from SRO's immutable poverty extract.}
    evidence_type_lists:
      - id: sro-child-benefit-list
        title: {en: SRO poverty evidence}
        evidence_types: [poverty-priority-v1]
  - id: mosd-child-benefit-v1
    iri: https://id.registrystack.org/solmara/requirement/mosd-child-benefit/v1
    title: {en: MoSD programme enrolment status}
    description: {en: Confirm that the person is not already enrolled through MoSD's governed Relay lookup.}
    evidence_type_lists:
      - id: mosd-child-benefit-list
        title: {en: MoSD enrolment evidence}
        evidence_types: [not-enrolled-v1]
  - id: sipf-pension-payment-v1
    iri: https://id.registrystack.org/solmara/requirement/sipf-pension-payment/v1
    title: {en: SIPF pension payment status}
    description: {en: Confirm active pension payment through SIPF's governed Relay lookup.}
    evidence_type_lists:
      - id: sipf-pension-payment-list
        title: {en: SIPF pension payment evidence}
        evidence_types: [pension-payment-active-v1]
  - id: sipf-survivor-benefit-v1
    iri: https://id.registrystack.org/solmara/requirement/sipf-survivor-benefit/v1
    title: {en: SIPF survivor eligibility}
    description: {en: Confirm survivor eligibility through SIPF's governed Relay lookup.}
    evidence_type_lists:
      - id: sipf-survivor-benefit-list
        title: {en: SIPF survivor evidence}
        evidence_types: [survivor-benefit-v1]
  - id: nagdi-voucher-v1
    iri: https://id.registrystack.org/solmara/requirement/nagdi-voucher/v1
    title: {en: NAgDI climate-smart voucher}
    description: {en: Confirm climate-smart voucher eligibility through NAgDI's governed Relay lookup.}
    evidence_type_lists:
      - id: nagdi-voucher-list
        title: {en: NAgDI voucher evidence}
        evidence_types: [climate-smart-voucher-v1]
  - id: nagdi-livestock-v1
    iri: https://id.registrystack.org/solmara/requirement/nagdi-livestock/v1
    title: {en: NAgDI livestock movement}
    description: {en: Confirm livestock movement eligibility through NAgDI's governed Relay lookup.}
    evidence_type_lists:
      - id: nagdi-livestock-list
        title: {en: NAgDI livestock evidence}
        evidence_types: [livestock-movement-v1]
evidence_types:
  - id: cra-child-benefit-v1
    iri: https://id.registrystack.org/solmara/evidence-type/cra-child-benefit/v1
    title: {en: CRA child benefit assertion}
    proves: [cra-child-benefit-v1]
    information_concepts:
      - https://id.registrystack.org/solmara/concept/birth-is-registered
      - https://id.registrystack.org/solmara/concept/child-age-under-5
  - id: cra-death-status-v1
    iri: https://id.registrystack.org/solmara/evidence-type/cra-death-status/v1
    title: {en: CRA death-status assertion}
    proves: [cra-pension-death-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/person-is-deceased]
  - id: civil-record-linked-v1
    iri: https://id.registrystack.org/solmara/evidence-type/civil-record-linked/v1
    title: {en: CRA civil-record assertion}
    proves: [cra-citizen-record-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/civil-record-linked]
  - id: population-active-v1
    iri: https://id.registrystack.org/solmara/evidence-type/population-active/v1
    title: {en: NIA active-population assertion}
    proves: [nia-child-benefit-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/population-record-active]
  - id: citizen-population-active-v1
    iri: https://id.registrystack.org/solmara/evidence-type/citizen-population-active/v1
    title: {en: NIA active-citizen assertion}
    proves: [nia-citizen-status-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/citizen-population-record-active]
  - id: poverty-priority-v1
    iri: https://id.registrystack.org/solmara/evidence-type/poverty-priority/v1
    title: {en: SRO poverty-priority assertion}
    proves: [sro-child-benefit-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/household-below-poverty-threshold]
  - id: not-enrolled-v1
    iri: https://id.registrystack.org/solmara/evidence-type/not-enrolled/v1
    title: {en: MoSD not-enrolled assertion}
    proves: [mosd-child-benefit-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/not-already-enrolled]
  - id: pension-payment-active-v1
    iri: https://id.registrystack.org/solmara/evidence-type/pension-payment-active/v1
    title: {en: SIPF active-payment assertion}
    proves: [sipf-pension-payment-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/pension-payment-active]
  - id: survivor-benefit-v1
    iri: https://id.registrystack.org/solmara/evidence-type/survivor-benefit/v1
    title: {en: SIPF survivor-benefit assertion}
    proves: [sipf-survivor-benefit-v1]
    information_concepts: [https://id.registrystack.org/solmara/concept/survivor-is-eligible]
  - id: climate-smart-voucher-v1
    iri: https://id.registrystack.org/solmara/evidence-type/climate-smart-voucher/v1
    title: {en: NAgDI climate-smart voucher assertion}
    proves: [nagdi-voucher-v1]
    information_concepts:
      - https://id.registrystack.org/solmara/concept/farmer-registered
      - https://id.registrystack.org/solmara/concept/data-use-authorized-for-purpose
      - https://id.registrystack.org/solmara/concept/eligible-for-climate-smart-input-voucher
  - id: livestock-movement-v1
    iri: https://id.registrystack.org/solmara/evidence-type/livestock-movement/v1
    title: {en: NAgDI livestock movement assertion}
    proves: [nagdi-livestock-v1]
    information_concepts:
      - https://id.registrystack.org/solmara/concept/registered-herd
      - https://id.registrystack.org/solmara/concept/origin-district-not-quarantined-for-species
      - https://id.registrystack.org/solmara/concept/eligible-for-livestock-movement-permit
public_services:
  - id: child-benefit-review
    iri: https://id.registrystack.org/solmara/services/child-benefit-review
    title: {en: Child benefit eligibility review}
    description: {en: The programme composes four independently signed authority assertions into five reviewed concepts.}
    competent_authority: mosd-programme-mis
    jurisdiction: https://id.registrystack.org/solmara/jurisdiction/XS
    holds_requirements: [cra-child-benefit-v1, nia-child-benefit-v1, sro-child-benefit-v1, mosd-child-benefit-v1]
    data_services: [cra-evidence-api, nia-evidence-api, sro-evidence-api, mosd-programme-evidence-api]
  - id: pension-survivor-review
    iri: https://id.registrystack.org/solmara/services/pension-survivor-review
    title: {en: Pension stop and survivor benefit review}
    description: {en: The programme composes CRA and SIPF signed assertions without exposing unrelated civil data.}
    competent_authority: sipf
    jurisdiction: https://id.registrystack.org/solmara/jurisdiction/XS
    holds_requirements: [cra-pension-death-v1, sipf-pension-payment-v1, sipf-survivor-benefit-v1]
    data_services: [cra-evidence-api, sipf-evidence-api]
  - id: citizen-self-service
    iri: https://id.registrystack.org/solmara/services/citizen-self-service
    title: {en: Citizen self-service}
    description: {en: The application composes separately signed CRA and NIA citizen assertions.}
    competent_authority: nia
    jurisdiction: https://id.registrystack.org/solmara/jurisdiction/XS
    holds_requirements: [cra-citizen-record-v1, nia-citizen-status-v1]
    data_services: [cra-evidence-api, nia-evidence-api]
  - id: agriculture-review
    iri: https://id.registrystack.org/solmara/services/agriculture-review
    title: {en: Agriculture voucher and livestock review}
    description: {en: NAgDI applications consume independently signed voucher and livestock assertions.}
    competent_authority: nagdi
    jurisdiction: https://id.registrystack.org/solmara/jurisdiction/XS
    holds_requirements: [nagdi-voucher-v1, nagdi-livestock-v1]
    data_services: [nagdi-evidence-api]
data_services:
  - id: cra-evidence-api
    iri: https://cra-evidence.solmara.registrystack.org/v1/evidence
    title: {en: CRA Evidence cell}
    endpoint_url: https://cra-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://cra-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
  - id: nia-evidence-api
    iri: https://nia-evidence.solmara.registrystack.org/v1/evidence
    title: {en: NIA Evidence cell}
    endpoint_url: https://nia-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://nia-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
  - id: sro-evidence-api
    iri: https://sro-evidence.solmara.registrystack.org/v1/evidence
    title: {en: SRO Evidence cell}
    endpoint_url: https://sro-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://sro-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
  - id: mosd-programme-evidence-api
    iri: https://mosd-programme-evidence.solmara.registrystack.org/v1/evidence
    title: {en: MoSD Programme Evidence cell}
    endpoint_url: https://mosd-programme-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://mosd-programme-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
  - id: sipf-evidence-api
    iri: https://sipf-evidence.solmara.registrystack.org/v1/evidence
    title: {en: SIPF Evidence cell}
    endpoint_url: https://sipf-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://sipf-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
  - id: nagdi-evidence-api
    iri: https://nagdi-evidence.solmara.registrystack.org/v1/evidence
    title: {en: NAgDI Evidence cell}
    endpoint_url: https://nagdi-evidence.solmara.registrystack.org/v1/evidence
    endpoint_description: https://nagdi-evidence.solmara.registrystack.org/v1/evidence-definitions
    conforms_to: https://id.registrystack.org/spec/registry-evidence/v1
datasets:
  - id: cra-civil
    title: {en: CRA civil registration publication}
    description: {en: CRA-owned immutable birth extract and governed civil-person Relay source.}
    access_rights: restricted
    entities:
      - name: civil_person
        identifiers: [{name: uin, kind: uin}]
        fields: [{name: uin, type: string, required: true}]
  - id: nia-population
    title: {en: NIA population publication}
    description: {en: NIA-owned immutable population extract and governed eSignet Relay source.}
    access_rights: restricted
    entities:
      - name: population_person
        identifiers: [{name: uin, kind: uin}]
        fields: [{name: uin, type: string, required: true}]
  - id: sro-social
    title: {en: SRO poverty extract}
    description: {en: SRO-owned immutable poverty publication.}
    access_rights: restricted
    entities:
      - name: poverty_record
        identifiers: [{name: uin, kind: uin}]
        fields: [{name: uin, type: string, required: true}]
  - id: mosd-programme
    title: {en: MoSD programme enrolment publication}
    description: {en: MoSD-owned mutable SQLite source consulted through Relay V2.}
    access_rights: restricted
    entities:
      - name: beneficiary_enrolment
        identifiers: [{name: uin, kind: uin}]
        fields: [{name: uin, type: string, required: true}]
  - id: sipf-pensions
    title: {en: SIPF pension and survivor publication}
    description: {en: SIPF-owned mutable SQLite source consulted through Relay V2.}
    access_rights: restricted
    entities:
      - name: pension_payment
        identifiers: [{name: pensioner_uin, kind: uin}]
        fields: [{name: pensioner_uin, type: string, required: true}]
      - name: survivor_case
        identifiers: [{name: spouse_uin, kind: uin}]
        fields: [{name: spouse_uin, type: string, required: true}]
  - id: nagdi-agriculture
    title: {en: NAgDI agriculture publication}
    description: {en: NAgDI-owned mutable SQLite source consulted through Relay V2.}
    access_rights: restricted
    entities:
      - name: farmer_voucher
        identifiers: [{name: farmer_id, kind: local}]
        fields: [{name: farmer_id, type: string, required: true}]
      - name: livestock_movement
        identifiers: [{name: farmer_id, kind: local}]
        fields: [{name: farmer_id, type: string, required: true}]
