name: solmara-lab-pensions-cells

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [runtime]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    audit-permissions: {condition: service_completed_successfully}

services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/sipf-relay, --destination, /audit/sipf-evidence, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [sipf-relay-audit:/audit/sipf-relay, sipf-evidence-audit:/audit/sipf-evidence]

  sipf-relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/sipf/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${SIPF_RELAY_AUDIT_KEY:?required}", SOLMARA_RELAY_CURSOR_KEY: "${SIPF_RELAY_CURSOR_KEY:?required}"}
    volumes: [/data/solmara-authority-cells/sipf-relay/runtime:/etc/relay/sipf:ro, /data/solmara-authority-cells/sipf-relay/source:/var/lib/relay/source:ro, sipf-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: sipf-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

  sipf-evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/sipf/runtime.yaml, serve]
    volumes: [/data/solmara-authority-cells/sipf-evidence/runtime:/etc/registry-evidence/sipf:ro, /data/solmara-authority-cells/sipf-evidence/secrets:/run/secrets/registry-evidence/sipf:ro, /data/solmara-authority-cells/sipf-evidence/transit:/run/registry-evidence/sipf:ro, sipf-evidence-audit:/var/lib/registry-evidence/sipf/audit]
    networks: {runtime: {ipv4_address: 172.29.4.25}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
      sipf-relay: {condition: service_started}
    labels: {solmara.lab.host: "${SOLMARA_SIPF_EVIDENCE_PUBLIC_HOST:-sipf-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells}

volumes:
  sipf-relay-audit:
  sipf-evidence-audit:
  superseded-state: {external: true, name: "${SOLMARA_SUPERSEDED_PENSIONS_VOLUME:-solmara-lab-pensions-state}"}

networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.4.0/24}]
