name: solmara-lab
x-hosted-evidence-environment: &hosted-evidence
  SOLMARA_LAB_MODE: hosted
  SOLMARA_MINT_URL: https://mint.solmara.registrystack.org
  SOLMARA_MINT_ASSERTION_AUDIENCE: https://mint.solmara.registrystack.org/token
  SOLMARA_EVIDENCE_CLIENT_ID: solmara-demo
  SOLMARA_EVIDENCE_CLIENT_KEY: /run/secrets/solmara-evidence-client.jwk
  SOLMARA_CRA_EVIDENCE_URL: https://cra-evidence.solmara.registrystack.org
  SOLMARA_NIA_EVIDENCE_URL: https://nia-evidence.solmara.registrystack.org
  SOLMARA_SRO_EVIDENCE_URL: https://sro-evidence.solmara.registrystack.org
  SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: https://mosd-programme-evidence.solmara.registrystack.org
  SOLMARA_SIPF_EVIDENCE_URL: https://sipf-evidence.solmara.registrystack.org
  SOLMARA_NAGDI_EVIDENCE_URL: https://nagdi-evidence.solmara.registrystack.org
  CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN:?required}
services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/mint, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [mint-audit:/audit/mint]
  mint:
    image: ${SOLMARA_MINT_IMAGE:?set the digest-pinned Solmara Mint image built from the verified release binary}
    command: ["serve", "--config", "/etc/registry-mint/mint.yaml"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: ["mint-runtime:/etc/registry-mint:ro", "mint-secrets:/run/secrets/registry-mint:ro", "mint-transit:/run/registry-mint:ro", "mint-audit:/var/lib/registry-mint"]
    networks: {runtime: {ipv4_address: 172.29.1.20}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
    labels: {solmara.lab.host: mint.solmara.registrystack.org, solmara.rollout.slot: authority-cells}
  static-metadata:
    image: ${SOLMARA_STATIC_METADATA_IMAGE:?set a digest-pinned Solmara static metadata image}
    restart: unless-stopped
    labels: {solmara.lab.host: metadata.solmara.registrystack.org}
  scenario-runner:
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:?set a digest-pinned Solmara scenario runner image}
    restart: unless-stopped
    environment:
      <<: *hosted-evidence
      CHILD_BENEFIT_FEDERATOR_URL: https://child-benefit.solmara.registrystack.org
      SCENARIO_RUNNER_HOST: 0.0.0.0
      SCENARIO_RUNNER_PORT: "8080"
    secrets:
      - source: solmara-demo-client-key
        target: solmara-evidence-client.jwk
    labels: {solmara.lab.host: scenarios.solmara.registrystack.org}
  child-benefit-federator:
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:?set a digest-pinned Solmara scenario runner image}
    command: ["python", "scenario-runner/child_benefit_federator.py"]
    restart: unless-stopped
    environment:
      <<: *hosted-evidence
      CHILD_BENEFIT_FEDERATOR_HOST: 0.0.0.0
      CHILD_BENEFIT_FEDERATOR_PORT: "8080"
    secrets:
      - source: solmara-demo-client-key
        target: solmara-evidence-client.jwk
    labels: {solmara.lab.host: child-benefit.solmara.registrystack.org}
  home:
    image: ${SOLMARA_HOME_IMAGE:?set a digest-pinned Solmara home image}
    restart: unless-stopped
    environment:
      PORTAL_URL: https://portal.solmara.registrystack.org
      STATIC_METADATA_URL: https://metadata.solmara.registrystack.org
      CRA_CIVIL_RELAY_URL: https://cra-relay.solmara.registrystack.org
      NIA_POPULATION_RELAY_URL: https://nia-relay.solmara.registrystack.org
      MOSD_PROGRAMME_RELAY_URL: https://mosd-programme-relay.solmara.registrystack.org
      SIPF_PENSIONS_RELAY_URL: https://sipf-relay.solmara.registrystack.org
      NAGDI_AGRICULTURE_RELAY_URL: https://nagdi-relay.solmara.registrystack.org
      SOLMARA_CRA_EVIDENCE_URL: https://cra-evidence.solmara.registrystack.org
      SOLMARA_NIA_EVIDENCE_URL: https://nia-evidence.solmara.registrystack.org
      SOLMARA_SRO_EVIDENCE_URL: https://sro-evidence.solmara.registrystack.org
      SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: https://mosd-programme-evidence.solmara.registrystack.org
      SOLMARA_SIPF_EVIDENCE_URL: https://sipf-evidence.solmara.registrystack.org
      SOLMARA_NAGDI_EVIDENCE_URL: https://nagdi-evidence.solmara.registrystack.org
      MINT_URL: https://mint.solmara.registrystack.org
      CHILD_BENEFIT_FEDERATOR_URL: https://child-benefit.solmara.registrystack.org
      SCENARIO_RUNNER_URL: https://scenarios.solmara.registrystack.org
      PORTAL_PROBE_URL: https://portal.solmara.registrystack.org
      SOLMARA_PUBLIC_URL_MAP: >-
        {"child-benefit-federator:8080":"https://child-benefit.solmara.registrystack.org",
        "deterministic-publisher:8080":"https://metadata.solmara.registrystack.org",
        "cra-evidence:8080":"https://cra-evidence.solmara.registrystack.org",
        "nia-evidence:8080":"https://nia-evidence.solmara.registrystack.org",
        "sro-evidence:8080":"https://sro-evidence.solmara.registrystack.org",
        "mosd-programme-evidence:8080":"https://mosd-programme-evidence.solmara.registrystack.org",
        "sipf-evidence:8080":"https://sipf-evidence.solmara.registrystack.org",
        "nagdi-evidence:8080":"https://nagdi-evidence.solmara.registrystack.org",
        "mint:8081":"https://mint.solmara.registrystack.org",
        "cra-relay:8080":"https://cra-relay.solmara.registrystack.org",
        "nia-relay:8080":"https://nia-relay.solmara.registrystack.org",
        "mosd-relay:8080":"https://mosd-programme-relay.solmara.registrystack.org",
        "sipf-relay:8080":"https://sipf-relay.solmara.registrystack.org",
        "nagdi-relay:8080":"https://nagdi-relay.solmara.registrystack.org",
        "static-metadata:8080":"https://metadata.solmara.registrystack.org",
        "scenario-runner:8080":"https://scenarios.solmara.registrystack.org",
        "portal:4000":"https://portal.solmara.registrystack.org"}
    labels: {solmara.lab.host: solmara.registrystack.org}
  portal:
    image: ${SOLMARA_PORTAL_IMAGE:?set a digest-pinned Solmara portal image}
    restart: unless-stopped
    environment:
      <<: *hosted-evidence
      PORTAL_PROVIDER: live
      PORTAL_AUTH_PROVIDER: mock
      PORTAL_SECURE_COOKIES: "true"
      SCENARIO_RUNNER_URL: https://scenarios.solmara.registrystack.org
      CHILD_BENEFIT_FEDERATOR_URL: https://child-benefit.solmara.registrystack.org
    secrets:
      - source: solmara-demo-client-key
        target: solmara-evidence-client.jwk
    labels: {solmara.lab.host: portal.solmara.registrystack.org}
secrets:
  solmara-demo-client-key:
    environment: SOLMARA_DEMO_CLIENT_PRIVATE_JWK
volumes:
  mint-runtime: {external: true, name: solmara-authority-cells-mint-runtime}
  mint-secrets: {external: true, name: solmara-authority-cells-mint-secrets}
  mint-transit: {external: true, name: solmara-authority-cells-mint-transit}
  mint-audit:
networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.1.0/24}]
