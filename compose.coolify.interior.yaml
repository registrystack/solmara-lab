name: solmara-lab-interior-cells

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [runtime]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    audit-permissions: {condition: service_completed_successfully}

services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/cra-relay, --destination, /audit/nia-relay, --destination, /audit/cra-evidence, --destination, /audit/nia-evidence, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [cra-relay-audit:/audit/cra-relay, nia-relay-audit:/audit/nia-relay, cra-evidence-audit:/audit/cra-evidence, nia-evidence-audit:/audit/nia-evidence]

  cra-relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/cra/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${CRA_RELAY_AUDIT_KEY:?required}"}
    volumes: [cra-relay-runtime:/etc/relay/cra:ro, cra-relay-source:/var/lib/relay/source:ro, cra-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: cra-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

  nia-relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/nia/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${NIA_RELAY_AUDIT_KEY:?required}"}
    volumes: [nia-relay-runtime:/etc/relay/nia:ro, nia-relay-source:/var/lib/relay/source:ro, nia-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: nia-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

  cra-evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/cra/runtime.yaml, serve]
    volumes: [cra-evidence-runtime:/etc/registry-evidence/cra:ro, cra-evidence-secrets:/run/secrets/registry-evidence/cra:ro, cra-evidence-transit:/run/registry-evidence/cra:ro, cra-evidence-extracts:/var/lib/registry-evidence/cra/extracts:ro, cra-evidence-audit:/var/lib/registry-evidence/cra/audit]
    networks: {runtime: {ipv4_address: 172.29.2.21}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
      cra-relay: {condition: service_started}
    labels: {solmara.lab.host: "${SOLMARA_CRA_EVIDENCE_PUBLIC_HOST:-cra-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells}

  nia-evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/nia/runtime.yaml, serve]
    volumes: [nia-evidence-runtime:/etc/registry-evidence/nia:ro, nia-evidence-secrets:/run/secrets/registry-evidence/nia:ro, nia-evidence-transit:/run/registry-evidence/nia:ro, nia-evidence-extracts:/var/lib/registry-evidence/nia/extracts:ro, nia-evidence-audit:/var/lib/registry-evidence/nia/audit]
    networks: {runtime: {ipv4_address: 172.29.2.22}}
    labels: {solmara.lab.host: "${SOLMARA_NIA_EVIDENCE_PUBLIC_HOST:-nia-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells}

volumes:
  cra-relay-runtime: {external: true, name: solmara-authority-cells-cra-relay-runtime}
  cra-relay-source: {external: true, name: solmara-authority-cells-cra-relay-source}
  nia-relay-runtime: {external: true, name: solmara-authority-cells-nia-relay-runtime}
  nia-relay-source: {external: true, name: solmara-authority-cells-nia-relay-source}
  cra-relay-audit:
  nia-relay-audit:
  cra-evidence-runtime: {external: true, name: solmara-authority-cells-cra-evidence-runtime}
  cra-evidence-secrets: {external: true, name: solmara-authority-cells-cra-evidence-secrets}
  cra-evidence-transit: {external: true, name: solmara-authority-cells-cra-evidence-transit}
  cra-evidence-extracts: {external: true, name: solmara-authority-cells-cra-evidence-extracts}
  cra-evidence-audit:
  nia-evidence-runtime: {external: true, name: solmara-authority-cells-nia-evidence-runtime}
  nia-evidence-secrets: {external: true, name: solmara-authority-cells-nia-evidence-secrets}
  nia-evidence-transit: {external: true, name: solmara-authority-cells-nia-evidence-transit}
  nia-evidence-extracts: {external: true, name: solmara-authority-cells-nia-evidence-extracts}
  nia-evidence-audit:
  superseded-state: {external: true, name: "${SOLMARA_SUPERSEDED_INTERIOR_VOLUME:-solmara-lab-interior-state}"}

networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.2.0/24}]
