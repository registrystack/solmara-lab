name: solmara-lab-interior-cells

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [runtime]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    audit-permissions: {condition: service_completed_successfully}

# Coolify matches a routed service against its exact compose key but resolves
# that key after rewriting "-" to "_", so a hyphenated name is stored where
# routing never reads it. Every service carrying solmara.lab.host therefore
# uses an underscore name.
services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/cra-relay, --destination, /audit/nia-relay, --destination, /audit/cra-evidence, --destination, /audit/nia-evidence, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [cra-relay-audit:/audit/cra-relay, nia-relay-audit:/audit/nia-relay, cra-evidence-audit:/audit/cra-evidence, nia-evidence-audit:/audit/nia-evidence]

  cra_relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/cra/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${CRA_RELAY_AUDIT_KEY:?required}"}
    volumes: [/data/solmara-authority-cells/cra-relay/runtime:/etc/relay/cra:ro, /data/solmara-authority-cells/cra-relay/source:/var/lib/relay/source:ro, cra-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: cra-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

  nia_relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/nia/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${NIA_RELAY_AUDIT_KEY:?required}"}
    volumes: [/data/solmara-authority-cells/nia-relay/runtime:/etc/relay/nia:ro, /data/solmara-authority-cells/nia-relay/source:/var/lib/relay/source:ro, nia-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: nia-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

  cra_evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/cra/runtime.yaml, serve]
    volumes: [/data/solmara-authority-cells/cra-evidence/runtime:/etc/registry-evidence/cra:ro, /data/solmara-authority-cells/cra-evidence/secrets:/run/secrets/registry-evidence/cra:ro, /data/solmara-authority-cells/cra-evidence/transit:/run/registry-evidence/cra:ro, /data/solmara-authority-cells/cra-evidence/extracts:/var/lib/registry-evidence/cra/extracts:ro, cra-evidence-audit:/var/lib/registry-evidence/cra/audit]
    networks: {runtime: {ipv4_address: 172.29.2.21}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
      cra_relay: {condition: service_started}
    labels: {solmara.lab.host: "${SOLMARA_CRA_EVIDENCE_PUBLIC_HOST:-cra-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

  nia_evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/nia/runtime.yaml, serve]
    volumes: [/data/solmara-authority-cells/nia-evidence/runtime:/etc/registry-evidence/nia:ro, /data/solmara-authority-cells/nia-evidence/secrets:/run/secrets/registry-evidence/nia:ro, /data/solmara-authority-cells/nia-evidence/transit:/run/registry-evidence/nia:ro, /data/solmara-authority-cells/nia-evidence/extracts:/var/lib/registry-evidence/nia/extracts:ro, nia-evidence-audit:/var/lib/registry-evidence/nia/audit]
    networks: {runtime: {ipv4_address: 172.29.2.22}}
    labels: {solmara.lab.host: "${SOLMARA_NIA_EVIDENCE_PUBLIC_HOST:-nia-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

volumes:
  cra-relay-audit:
  nia-relay-audit:
  cra-evidence-audit:
  nia-evidence-audit:
  superseded-state: {external: true, name: "${SOLMARA_SUPERSEDED_INTERIOR_VOLUME:-solmara-lab-interior-state}"}

networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.2.0/24}]
