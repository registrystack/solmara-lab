name: release-candidate

on:
  workflow_dispatch:
    inputs:
      solmara_image_tag:
        description: Tag for Solmara-owned images. Defaults to the workflow commit SHA.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    env:
      SOLMARA_IMAGE_REGISTRY: ghcr.io/registrystack
      SOLMARA_IMAGE_TAG: ${{ inputs.solmara_image_tag || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read immutable Registry Stack source identity
        id: registry-stack
        run: |
          set -euo pipefail
          set -a
          source versions.env
          set +a
          printf 'source_ref=%s\n' "$REGISTRY_STACK_SOURCE_REF" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$REGISTRY_STACK_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          for key in ESIGNET_BASE_IMAGE ESIGNET_POSTGRES_IMAGE ESIGNET_UI_IMAGE \
            ESIGNET_AUTHENTICATOR_JAR_URL ESIGNET_AUTHENTICATOR_JAR_SHA256 \
            REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_URL REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_SHA256 \
            REGISTRY_STACK_RELEASE_MINT_ASSET_URL REGISTRY_STACK_RELEASE_MINT_ASSET_SHA256 \
            REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_URL REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_SHA256; do
            value="$(printenv "$key")"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Require published v0.20.1 Registry Stack and authenticator pins
        run: scripts/check-registry-stack-release-pin.py --require-public
      - name: Checkout the exact Registry Stack source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: registrystack/registry-stack
          ref: ${{ steps.registry-stack.outputs.source_commit }}
          path: vendor/registry-stack
          persist-credentials: false
      - name: Verify Registry Stack source and published runtime artifacts
        run: |
          set -euo pipefail
          set -a
          source versions.env
          set +a
          test "$(git -C vendor/registry-stack rev-parse HEAD)" = "$REGISTRY_STACK_SOURCE_COMMIT"
          relay_image="ghcr.io/registrystack/relay@sha256:${REGISTRY_STACK_RELEASE_RELAY_DIGEST}"
          docker pull "$relay_image"
          revision="$(docker image inspect "$relay_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$REGISTRY_STACK_SOURCE_COMMIT"
          for component in evidence mint relayctl; do
            url_variable="REGISTRY_STACK_RELEASE_${component^^}_ASSET_URL"
            sha_variable="REGISTRY_STACK_RELEASE_${component^^}_ASSET_SHA256"
            curl --fail --location --silent --show-error "${!url_variable}" --output "$component-v0.20.1"
            printf '%s  %s\n' "${!sha_variable}" "$component-v0.20.1" | sha256sum --check --status
            rm -f "$component-v0.20.1"
          done
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3.11.1
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install --yes just
      - name: Install dependencies
        run: |
          corepack enable
          just setup
      - name: Install browser test dependencies
        run: |
          cd portal && pnpm exec playwright install --with-deps chromium
          cd ../home && pnpm exec playwright install chromium
      - name: Generate and validate authority-cell runtime
        env:
          REGISTRY_STACK_SOURCE_DIR: ${{ github.workspace }}/vendor/registry-stack
        run: |
          just prepare
          just metadata-publish
          just lint
          just test
          just compose
          just relay-check
      - name: Start and smoke authority cells
        env:
          REGISTRY_STACK_SOURCE_DIR: ${{ github.workspace }}/vendor/registry-stack
        run: |
          just up
          just smoke
          just evidence-check
          just programme-acceptance
          just lifecycle-proof
          just portal-live-e2e
          just home-live-e2e
      - name: Record recoverable rollout phases
        run: |
          just rollout side-by-side
          just rollout switch
          just rollout disable
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require pre-provisioned public Solmara packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in \
            solmara-lab-evidence \
            solmara-lab-mint \
            solmara-lab-authority-provisioner \
            solmara-lab-transit-signer; do
            visibility="$(gh api "/orgs/registrystack/packages/container/${package}" --jq .visibility)"
            if [ "$visibility" != public ]; then
              echo "$package must be pre-provisioned as a public package with Actions write access" >&2
              exit 1
            fi
          done
      - name: Build and push verified Evidence release binary
        id: evidence
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/registry-stack-release-binary/Dockerfile
          target: evidence
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-evidence:${{ env.SOLMARA_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ steps.registry-stack.outputs.source_commit }}
            org.opencontainers.image.version=0.20.1
            org.opencontainers.image.source=https://github.com/registrystack/registry-stack
          build-args: |
            REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_URL=${{ env.REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_URL }}
            REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_SHA256=${{ env.REGISTRY_STACK_RELEASE_EVIDENCE_ASSET_SHA256 }}
      - name: Build and push verified Mint release binary
        id: mint
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/registry-stack-release-binary/Dockerfile
          target: mint
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-mint:${{ env.SOLMARA_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ steps.registry-stack.outputs.source_commit }}
            org.opencontainers.image.version=0.20.1
            org.opencontainers.image.source=https://github.com/registrystack/registry-stack
          build-args: |
            REGISTRY_STACK_RELEASE_MINT_ASSET_URL=${{ env.REGISTRY_STACK_RELEASE_MINT_ASSET_URL }}
            REGISTRY_STACK_RELEASE_MINT_ASSET_SHA256=${{ env.REGISTRY_STACK_RELEASE_MINT_ASSET_SHA256 }}
      - name: Verify Solmara Evidence and Mint image source labels
        run: |
          set -euo pipefail
          for component in evidence mint; do
            case "$component" in
              evidence) digest='${{ steps.evidence.outputs.digest }}' ;;
              mint) digest='${{ steps.mint.outputs.digest }}' ;;
            esac
            image="$SOLMARA_IMAGE_REGISTRY/solmara-lab-${component}@${digest}"
            docker pull "$image"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = '${{ steps.registry-stack.outputs.source_commit }}'
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = 0.20.1
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = https://github.com/registrystack/registry-stack
          done
      - name: Build and push authority provisioner
        id: authority_provisioner
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/hosted-authority-provisioner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-authority-provisioner:${{ env.SOLMARA_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.SOLMARA_IMAGE_TAG }}
            org.opencontainers.image.source=https://github.com/registrystack/solmara-lab
            org.registrystack.release.version=0.20.1
            org.registrystack.release.revision=${{ steps.registry-stack.outputs.source_commit }}
          build-args: |
            REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_URL=${{ env.REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_URL }}
            REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_SHA256=${{ env.REGISTRY_STACK_RELEASE_RELAYCTL_ASSET_SHA256 }}
      - name: Build and push Transit signer
        id: transit_signer
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/hosted-transit-signer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-transit-signer:${{ env.SOLMARA_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.SOLMARA_IMAGE_TAG }}
            org.opencontainers.image.source=https://github.com/registrystack/solmara-lab
            org.registrystack.release.version=0.20.1
            org.registrystack.release.revision=${{ steps.registry-stack.outputs.source_commit }}
      - name: Verify hosted authority image source labels
        run: |
          set -euo pipefail
          for component in authority-provisioner transit-signer; do
            case "$component" in
              authority-provisioner) digest='${{ steps.authority_provisioner.outputs.digest }}' ;;
              transit-signer) digest='${{ steps.transit_signer.outputs.digest }}' ;;
            esac
            image="$SOLMARA_IMAGE_REGISTRY/solmara-lab-${component}@${digest}"
            docker pull "$image"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = '${{ github.sha }}'
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = https://github.com/registrystack/solmara-lab
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.registrystack.release.version" }}')" = 0.20.1
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.registrystack.release.revision" }}')" = '${{ steps.registry-stack.outputs.source_commit }}'
          done
      - name: Smoke hosted authority provisioner image
        run: |
          set -euo pipefail
          image="$SOLMARA_IMAGE_REGISTRY/solmara-lab-authority-provisioner@${{ steps.authority_provisioner.outputs.digest }}"
          state="$RUNNER_TEMP/solmara-authority-provisioner-state"
          mkdir -p "$state/runtime" "$state/source"
          for _ in 1 2; do
            docker run --rm --network none --read-only --tmpfs /tmp \
              --mount "type=bind,source=$state/runtime,target=/provisioned/runtime" \
              --mount "type=bind,source=$state/source,target=/provisioned/source" \
              "$image" provision \
              --target cra-relay \
              --assets /opt/solmara-hosted-assets \
              --secrets /run/secrets/solmara-provisioning \
              --runtime-output /provisioned/runtime \
              --source-output /provisioned/source
          done
          python3 - "$state" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          with sqlite3.connect(f"file:{root / 'source/cra.sqlite'}?mode=ro", uri=True) as connection:
              assert connection.execute("PRAGMA quick_check").fetchall() == [("ok",)]
          assert (root / "runtime/runtime.yaml").is_file()
          assert any((root / "runtime/package").iterdir())
          PY
          chmod u+w "$state/runtime/runtime.yaml"
          printf '\n' >> "$state/runtime/runtime.yaml"
          stdout="$RUNNER_TEMP/solmara-authority-provisioner.stdout"
          stderr="$RUNNER_TEMP/solmara-authority-provisioner.stderr"
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp \
            --mount "type=bind,source=$state/runtime,target=/provisioned/runtime" \
            --mount "type=bind,source=$state/source,target=/provisioned/source" \
            "$image" provision \
            --target cra-relay \
            --assets /opt/solmara-hosted-assets \
            --secrets /run/secrets/solmara-provisioning \
            --runtime-output /provisioned/runtime \
            --source-output /provisioned/source >"$stdout" 2>"$stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$stdout"
          test "$(cat "$stderr")" = "hosted target provisioning failed"
          uv run scripts/smoke-hosted-provisioner-image.py \
            --image "$image" \
            --state-root "$RUNNER_TEMP/solmara-authority-provisioner-authority-state"
      - name: Smoke hosted Transit signer image
        run: |
          set -euo pipefail
          image="$SOLMARA_IMAGE_REGISTRY/solmara-lab-transit-signer@${{ steps.transit_signer.outputs.digest }}"
          docker run --rm --network none --read-only --entrypoint python "$image" -c 'import cryptography'
          stdout="$RUNNER_TEMP/solmara-transit-signer.stdout"
          stderr="$RUNNER_TEMP/solmara-transit-signer.stderr"
          set +e
          docker run --rm --network none --read-only "$image" >"$stdout" 2>"$stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$stdout"
          test "$(cat "$stderr")" = "hosted Transit signer could not start"
      - name: Build and push static metadata
        id: static_metadata
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/static-metadata/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-static-metadata:${{ env.SOLMARA_IMAGE_TAG }}
      - name: Build and push scenario runner
        id: scenario_runner
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scenario-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-scenario-runner:${{ env.SOLMARA_IMAGE_TAG }}
      - name: Build and push Visitor Center
        id: home
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: home/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-home:${{ env.SOLMARA_IMAGE_TAG }}
      - name: Build and push programme portal
        id: portal
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./portal
          file: ./portal/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-portal:${{ env.SOLMARA_IMAGE_TAG }}
      - name: Build and push eSignet Relay V2 authenticator image
        id: esignet_relay
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/esignet-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-relay:${{ env.SOLMARA_IMAGE_TAG }}
          build-args: |
            ESIGNET_BASE_IMAGE=${{ env.ESIGNET_BASE_IMAGE }}
            ESIGNET_AUTHENTICATOR_JAR_URL=${{ env.ESIGNET_AUTHENTICATOR_JAR_URL }}
            ESIGNET_AUTHENTICATOR_JAR_SHA256=${{ env.ESIGNET_AUTHENTICATOR_JAR_SHA256 }}
      - name: Build and push isolated eSignet database
        id: esignet_postgres
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/esignet-postgres/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-postgres:${{ env.SOLMARA_IMAGE_TAG }}
          build-args: |
            POSTGRES_IMAGE=${{ env.ESIGNET_POSTGRES_IMAGE }}
      - name: Build and push eSignet UI
        id: esignet_ui
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/esignet-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-ui:${{ env.SOLMARA_IMAGE_TAG }}
          build-args: |
            ESIGNET_UI_IMAGE=${{ env.ESIGNET_UI_IMAGE }}
            ESIGNET_NGINX_CONF=config/esignet/nginx-hosted.conf
      - name: Build and push eSignet seed image
        id: esignet_seed
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/esignet-seed/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-seed:${{ env.SOLMARA_IMAGE_TAG }}
      - name: Generate Coolify image manifest
        env:
          SOLMARA_EVIDENCE_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-evidence@${{ steps.evidence.outputs.digest }}
          SOLMARA_MINT_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-mint@${{ steps.mint.outputs.digest }}
          SOLMARA_AUTHORITY_PROVISIONER_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-authority-provisioner@${{ steps.authority_provisioner.outputs.digest }}
          SOLMARA_TRANSIT_SIGNER_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-transit-signer@${{ steps.transit_signer.outputs.digest }}
          SOLMARA_STATIC_METADATA_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-static-metadata@${{ steps.static_metadata.outputs.digest }}
          SOLMARA_SCENARIO_RUNNER_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-scenario-runner@${{ steps.scenario_runner.outputs.digest }}
          SOLMARA_HOME_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-home@${{ steps.home.outputs.digest }}
          SOLMARA_PORTAL_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-portal@${{ steps.portal.outputs.digest }}
          SOLMARA_ESIGNET_RELAY_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-relay@${{ steps.esignet_relay.outputs.digest }}
          SOLMARA_ESIGNET_POSTGRES_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-postgres@${{ steps.esignet_postgres.outputs.digest }}
          SOLMARA_ESIGNET_UI_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-ui@${{ steps.esignet_ui.outputs.digest }}
          SOLMARA_ESIGNET_SEED_IMAGE: ${{ env.SOLMARA_IMAGE_REGISTRY }}/solmara-lab-esignet-seed@${{ steps.esignet_seed.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/solmara-release/solmara-hosted-images.env"
          python3 scripts/hosted-image-manifest.py write --output "$manifest"
          python3 scripts/hosted-image-manifest.py validate --manifest "$manifest"
      - name: Upload Coolify image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solmara-hosted-images-${{ github.sha }}
          path: ${{ runner.temp }}/solmara-release/solmara-hosted-images.env
          if-no-files-found: error
          retention-days: 30
      - name: Report immutable Solmara image digests
        run: |
          {
            echo "### Solmara image digests"
            echo
            while IFS='=' read -r key image; do
              printf -- '- %s=%s\n' "$key" "$image"
            done < "$RUNNER_TEMP/solmara-release/solmara-hosted-images.env"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop authority-cell stack
        if: always()
        run: just down || true
