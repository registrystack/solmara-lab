name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-cell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install --yes just
      - name: Install dependencies
        run: |
          corepack enable
          just setup
      - name: Generate ignored runtime material
        run: just generate
      - name: Publish checked-in metadata
        run: just metadata-publish
      - name: Lint authority-cell configuration
        run: just lint
      - name: Test authority-cell application
        run: just test
      - name: Validate and package all Relay V2 projects
        run: just relay-check
      - name: Validate Compose topology
        run: just compose
