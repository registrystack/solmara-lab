name: solmara-lab-wallet
services:
  wallet-api:
    image: docker.io/waltid/wallet-api@sha256:2c10973dfbf7ecfa07bc45c35499b2689bdba1217cc95e05d1c18d0d88d9a7c6
    restart: unless-stopped
    environment: {DATABASE_ENGINE: sqlite, SQLITE_FILE: /data/wallet.sqlite}
    volumes: ["wallet-data:/data"]
  wallet-ui:
    image: docker.io/waltid/waltid-demo-wallet@sha256:e7778f62b7ad812e9191151a958495d6493b7c81d176f23a018929aa5deb3274
    restart: unless-stopped
  caddy:
    image: docker.io/library/caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    restart: unless-stopped
    volumes: ["./config/walt/Caddyfile:/etc/caddy/Caddyfile:ro", "wallet-caddy-data:/data"]
    labels: {solmara.lab.host: wallet.solmara.registrystack.org}
volumes:
  wallet-data:
  wallet-caddy-data:
