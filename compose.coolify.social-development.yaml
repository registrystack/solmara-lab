name: solmara-lab-social-development

x-relay-environment: &relay-environment
  RUST_LOG: ${RUST_LOG:-info}
  REGISTRY_RELAY_BIND: 0.0.0.0:8080

x-relay-common: &relay-common
  image: ${SOLMARA_RELAY_IMAGE:?set digest-pinned Solmara Relay image}
  platform: ${REGISTRY_STACK_PLATFORM:-linux/amd64}
  restart: unless-stopped
  environment: *relay-environment
  healthcheck:
    test: ["CMD", "/usr/local/bin/registry-relay", "healthcheck"]
    interval: 30s
    timeout: 10s
    retries: 3

x-relay-config-state-init: &relay-config-state-init
  image: ${SOLMARA_RELAY_IMAGE:?set digest-pinned Solmara Relay image}
  platform: ${REGISTRY_STACK_PLATFORM:-linux/amd64}
  user: "0:0"
  restart: "no"
  entrypoint: ["/bin/busybox", "sh", "-eu", "-c"]

x-workload-agent-common: &workload-agent-common
  image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:?set digest-pinned Solmara scenario runner image}
  command: ["python", "scripts/relay_workload_identity_agent.py"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
    interval: 10s
    timeout: 5s
    retries: 6

services:
  sro-evidence-workload-agent:
    <<: *workload-agent-common
    environment:
      WORKLOAD_ISSUER: https://workload-issuer.solmara.registrystack.org
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["sro_child:rows"],"token_file":"/run/secrets/sro-relay-token","private_jwk_env":"SRO_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      SRO_RELAY_WORKLOAD_JWK: ${SRO_RELAY_WORKLOAD_JWK}
    volumes:
      - sro-evidence-workload-token:/run/secrets

  programme-evidence-workload-agent:
    <<: *workload-agent-common
    environment:
      WORKLOAD_ISSUER: https://workload-issuer.solmara.registrystack.org
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["mosd_enroll:rows"],"token_file":"/run/secrets/programme-relay-token","private_jwk_env":"PROGRAMME_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      PROGRAMME_RELAY_WORKLOAD_JWK: ${PROGRAMME_RELAY_WORKLOAD_JWK}
    volumes:
      - programme-evidence-workload-token:/run/secrets

  sro-relay-config-state-init:
    <<: *relay-config-state-init
    command:
      - |
        /bin/busybox mkdir -p /var/lib/registry-relay/cache
        /bin/busybox chown 65532:65532 /var/lib/registry-relay/cache
        if ! /bin/busybox test -e /var/lib/registry-relay/cache/config-bundle-antirollback.json; then
          /bin/busybox cp /etc/solmara/hosted-relay-bundles/sro-social/antirollback-seed.json /var/lib/registry-relay/cache/config-bundle-antirollback.json
          /bin/busybox chown 65532:65532 /var/lib/registry-relay/cache/config-bundle-antirollback.json
          /bin/busybox chmod 0600 /var/lib/registry-relay/cache/config-bundle-antirollback.json
        fi
    volumes:
      - sro-relay-cache:/var/lib/registry-relay/cache

  programme-relay-config-state-init:
    <<: *relay-config-state-init
    command:
      - |
        /bin/busybox mkdir -p /var/lib/registry-relay/cache
        /bin/busybox chown 65532:65532 /var/lib/registry-relay/cache
        if ! /bin/busybox test -e /var/lib/registry-relay/cache/config-bundle-antirollback.json; then
          /bin/busybox cp /etc/solmara/hosted-relay-bundles/mosd-programme/antirollback-seed.json /var/lib/registry-relay/cache/config-bundle-antirollback.json
          /bin/busybox chown 65532:65532 /var/lib/registry-relay/cache/config-bundle-antirollback.json
          /bin/busybox chmod 0600 /var/lib/registry-relay/cache/config-bundle-antirollback.json
        fi
    volumes:
      - programme-relay-cache:/var/lib/registry-relay/cache

  sro-social-relay:
    <<: *relay-common
    command: ["--config", "/etc/solmara/hosted-relay-bundles/sro-social/bootstrap.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${SRO_RELAY_AUDIT_HASH_SECRET}
    expose: ["8080"]
    volumes:
      - sro-relay-cache:/var/lib/registry-relay/cache
    depends_on:
      sro-relay-config-state-init: { condition: service_completed_successfully }
    labels:
      solmara.lab.host: sro-relay.solmara.registrystack.org

  programme-mis-relay:
    <<: *relay-common
    command: ["--config", "/etc/solmara/hosted-relay-bundles/mosd-programme/bootstrap.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${PROGRAMME_RELAY_AUDIT_HASH_SECRET}
    expose: ["8080"]
    volumes:
      - programme-relay-cache:/var/lib/registry-relay/cache
    depends_on:
      programme-relay-config-state-init: { condition: service_completed_successfully }
    labels:
      solmara.lab.host: mosd-programme-relay.solmara.registrystack.org

volumes:
  sro-relay-cache:
  programme-relay-cache:
  sro-evidence-workload-token:
    name: ${SRO_EVIDENCE_WORKLOAD_TOKEN_VOLUME:-solmara-sro-evidence-workload-token}
  programme-evidence-workload-token:
    name: ${PROGRAMME_EVIDENCE_WORKLOAD_TOKEN_VOLUME:-solmara-programme-evidence-workload-token}
