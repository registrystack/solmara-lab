name: solmara-lab-social-cells

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [runtime]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    audit-permissions: {condition: service_completed_successfully}

# Coolify matches a routed service against its exact compose key but resolves
# that key after rewriting "-" to "_", so a hyphenated name is stored where
# routing never reads it. Every service carrying solmara.lab.host therefore
# uses an underscore name.
services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/mosd-relay, --destination, /audit/sro-evidence, --destination, /audit/mosd-evidence, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [mosd-relay-audit:/audit/mosd-relay, sro-evidence-audit:/audit/sro-evidence, mosd-evidence-audit:/audit/mosd-evidence]

  mosd_relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/mosd/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${MOSD_RELAY_AUDIT_KEY:?required}"}
    volumes: [/data/solmara-authority-cells/mosd-relay/runtime:/etc/relay/mosd:ro, /data/solmara-authority-cells/mosd-relay/source:/var/lib/relay/source:ro, mosd-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: mosd-programme-relay-authority-cells.solmara.registrystack.org, solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

  sro_evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/sro/runtime.yaml, serve]
    volumes: [/data/solmara-authority-cells/sro-evidence/runtime:/etc/registry-evidence/sro:ro, /data/solmara-authority-cells/sro-evidence/secrets:/run/secrets/registry-evidence/sro:ro, /data/solmara-authority-cells/sro-evidence/transit:/run/registry-evidence/sro:ro, /data/solmara-authority-cells/sro-evidence/extracts:/var/lib/registry-evidence/sro/extracts:ro, sro-evidence-audit:/var/lib/registry-evidence/sro/audit]
    networks: {runtime: {ipv4_address: 172.29.3.23}}
    labels: {solmara.lab.host: "${SOLMARA_SRO_EVIDENCE_PUBLIC_HOST:-sro-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

  mosd_programme_evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/mosd-programme/runtime.yaml, serve]
    volumes: [/data/solmara-authority-cells/mosd-evidence/runtime:/etc/registry-evidence/mosd-programme:ro, /data/solmara-authority-cells/mosd-evidence/secrets:/run/secrets/registry-evidence/mosd-programme:ro, /data/solmara-authority-cells/mosd-evidence/transit:/run/registry-evidence/mosd-programme:ro, mosd-evidence-audit:/var/lib/registry-evidence/mosd-programme/audit]
    networks: {runtime: {ipv4_address: 172.29.3.24}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
      mosd_relay: {condition: service_started}
    labels: {solmara.lab.host: "${SOLMARA_MOSD_PROGRAMME_EVIDENCE_PUBLIC_HOST:-mosd-programme-evidence.solmara.registrystack.org}", solmara.rollout.slot: authority-cells, traefik.docker.network: "${COOLIFY_RESOURCE_UUID:?set by Coolify for every deployment}"}

volumes:
  mosd-relay-audit:
  sro-evidence-audit:
  mosd-evidence-audit:
  superseded-state: {external: true, name: "${SOLMARA_SUPERSEDED_SOCIAL_VOLUME:-solmara-lab-social-state}"}

networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.3.0/24}]
