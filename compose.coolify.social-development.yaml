name: solmara-lab-social-cells

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [runtime]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    audit-permissions: {condition: service_completed_successfully}

services:
  audit-permissions:
    image: ${SOLMARA_AUTHORITY_PROVISIONER_IMAGE:?set the digest-pinned Solmara authority provisioner image}
    entrypoint: [python, /app/scripts/provision-hosted-runtime.py]
    command: [init-audit, --destination, /audit/mosd-relay, --destination, /audit/sro-evidence, --destination, /audit/mosd-evidence, --uid, "65532", --gid, "65532"]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [mosd-relay-audit:/audit/mosd-relay, sro-evidence-audit:/audit/sro-evidence, mosd-evidence-audit:/audit/mosd-evidence]

  mosd-relay:
    <<: *runtime
    image: ${REGISTRY_RELAY_IMAGE:?set the digest-pinned official Registry Stack Relay image}
    command: [serve, --runtime, /etc/relay/mosd/runtime.yaml]
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${MOSD_RELAY_AUDIT_KEY:?required}"}
    volumes: [mosd-relay-runtime:/etc/relay/mosd:ro, mosd-relay-source:/var/lib/relay/source:ro, mosd-relay-audit:/var/lib/relay/audit]
    labels: {solmara.lab.host: mosd-programme-relay.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

  sro-evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/sro/runtime.yaml, serve]
    volumes: [sro-evidence-runtime:/etc/registry-evidence/sro:ro, sro-evidence-secrets:/run/secrets/registry-evidence/sro:ro, sro-evidence-transit:/run/registry-evidence/sro:ro, sro-evidence-extracts:/var/lib/registry-evidence/sro/extracts:ro, sro-evidence-audit:/var/lib/registry-evidence/sro/audit]
    networks: {runtime: {ipv4_address: 172.29.3.23}}
    labels: {solmara.lab.host: sro-evidence.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

  mosd-programme-evidence:
    <<: *runtime
    image: ${SOLMARA_EVIDENCE_IMAGE:?set the digest-pinned official Registry Stack Evidence image}
    command: [--runtime, /etc/registry-evidence/mosd-programme/runtime.yaml, serve]
    volumes: [mosd-evidence-runtime:/etc/registry-evidence/mosd-programme:ro, mosd-evidence-secrets:/run/secrets/registry-evidence/mosd-programme:ro, mosd-evidence-transit:/run/registry-evidence/mosd-programme:ro, mosd-evidence-audit:/var/lib/registry-evidence/mosd-programme/audit]
    networks: {runtime: {ipv4_address: 172.29.3.24}}
    depends_on:
      audit-permissions: {condition: service_completed_successfully}
      mosd-relay: {condition: service_started}
    labels: {solmara.lab.host: mosd-programme-evidence.solmara.registrystack.org, solmara.rollout.slot: authority-cells}

volumes:
  mosd-relay-runtime: {external: true, name: solmara-authority-cells-mosd-relay-runtime}
  mosd-relay-source: {external: true, name: solmara-authority-cells-mosd-relay-source}
  mosd-relay-audit:
  sro-evidence-runtime: {external: true, name: solmara-authority-cells-sro-evidence-runtime}
  sro-evidence-secrets: {external: true, name: solmara-authority-cells-sro-evidence-secrets}
  sro-evidence-transit: {external: true, name: solmara-authority-cells-sro-evidence-transit}
  sro-evidence-extracts: {external: true, name: solmara-authority-cells-sro-evidence-extracts}
  sro-evidence-audit:
  mosd-evidence-runtime: {external: true, name: solmara-authority-cells-mosd-evidence-runtime}
  mosd-evidence-secrets: {external: true, name: solmara-authority-cells-mosd-evidence-secrets}
  mosd-evidence-transit: {external: true, name: solmara-authority-cells-mosd-evidence-transit}
  mosd-evidence-audit:
  superseded-state: {external: true, name: "${SOLMARA_SUPERSEDED_SOCIAL_VOLUME:-solmara-lab-social-state}"}

networks:
  runtime:
    ipam:
      config: [{subnet: 172.29.3.0/24}]
