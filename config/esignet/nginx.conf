worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 3000;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /v1/esignet {
      proxy_pass http://esignet:8088/v1/esignet;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location /.well-known/openid-configuration {
      proxy_pass http://esignet:8088/v1/esignet/oidc/.well-known/openid-configuration;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location /.well-known/jwks.json {
      proxy_pass http://esignet:8088/v1/esignet/oauth/.well-known/jwks.json;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location /.well-known/oauth-authorization-server {
      proxy_pass http://esignet:8088/v1/esignet/oauth/.well-known/oauth-authorization-server;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location /.well-known/openid-credential-issuer {
      proxy_pass http://esignet:8088/v1/esignet/vci/.well-known/openid-credential-issuer;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Content-Security-Policy "
          default-src 'self';
          style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://cdn.jsdelivr.net https://*.mosip.net;
          script-src 'self' https://www.google.com https://www.gstatic.com;
          frame-src https://www.google.com;
          connect-src 'self' http://127.0.0.1:* http://localhost:*;
        " always;
      add_header Referrer-Policy "no-referrer" always;
    }
  }
}
