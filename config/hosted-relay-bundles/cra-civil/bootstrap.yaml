audit:
  hash_secret_env: REGISTRY_RELAY_AUDIT_HASH_SECRET
  sink: stdout
auth:
  mode: oidc
  oidc:
    allow_dev_insecure_fetch_urls: false
    allowed_clients: []
    audiences:
    - registry-relay
    issuer: https://workload-issuer.solmara.registrystack.org
    jwks_url: https://workload-issuer.solmara.registrystack.org/.well-known/jwks.json
catalog:
  base_url: https://cra-relay.solmara.registrystack.org
  publisher: solmara-cra-civil
  title: solmara-cra-civil governed Registry Relay
datasets:
- access_rights: restricted
  aggregates: []
  conforms_to: []
  defaults:
    materialization: snapshot
    refresh:
      interval: 1m
      mode: interval
  description: Materialized civil_people entity
  entities: []
  id: civil_people
  owner: solmara-cra-civil
  sensitivity: personal
  tables:
  - access:
      aggregate_scope: civil_people:aggregate
      metadata_scope: registry-internal:materialization
    aggregates: []
    api:
      allowed_filters: []
      default_limit: 1
      max_limit: 1
      require_purpose_header: false
    id: materialization_f5d795774cce29f1dfb681aae7844653315f52188d39b841602bb758e7e53382
    materialization: snapshot
    primary_key: uin
    refresh:
      interval: 1m
      mode: interval
    schema:
      fields:
      - name: birth_brn
        nullable: true
        sensitive: true
        type: string
      - name: birth_date
        nullable: false
        sensitive: true
        type: date
      - name: deceased
        nullable: false
        sensitive: true
        type: boolean
      - name: uin
        nullable: false
        sensitive: true
        type: string
      strict: true
    source:
      format:
        csv:
          delimiter: null
          header_row: 1
          quote: null
      path: /var/lib/solmara/ministries/interior-civil/fixtures/civil_person_projection.csv
      type: file
  title: civil_people
  update_frequency: as_needed
deployment:
  profile: hosted_lab
instance:
  environment: hosted
  id: cra-civil-relay
server:
  bind: 127.0.0.1:8080
standards: {}
config_trust:
  trust_anchor_path: /etc/solmara/hosted-relay-bundles/cra-civil/trust-anchor.json
  bundle_path: /etc/solmara/hosted-relay-bundles/cra-civil/bundle
  antirollback_state_path: /var/lib/registry-relay/cache/config-bundle-antirollback.json
