name: ${COMPOSE_PROJECT_NAME:-solmara-lab}

x-relay: &relay
  image: ${REGISTRY_RELAY_IMAGE:?versions.env must name the digest-pinned Relay V2 image}
  platform: linux/amd64
  user: "65532:65532"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  networks: [runtime, issuer-validation]
  depends_on: {relay-audit-init: {condition: service_completed_successfully}}
  healthcheck:
    test: ["CMD", "/usr/local/bin/relay", "healthcheck", "--url", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 12

x-evidence: &evidence
  image: ${SOLMARA_EVIDENCE_IMAGE:?versions.env must name the digest-pinned official Registry Stack Evidence image}
  platform: linux/amd64
  restart: unless-stopped
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: {SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt}
  networks: [runtime, issuer-validation]

# Docker Desktop and Linux preserve different owners for host bind mounts. Copy
# each authority's closed secret set into its own volume so the official
# runtimes see the exact ownership and mode required by SecretResolver.
x-authority-secret-stager: &authority-secret-stager
  image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
  entrypoint:
    - python
    - -c
    - |-
      import os
      import stat
      import sys

      max_secret_bytes = 64 * 1024
      expected = set(sys.argv[2:])
      if sys.argv[1:2] != ['stage'] or not expected or len(expected) != len(sys.argv) - 2:
          raise RuntimeError('invalid secret allowlist')
      source_fd = os.open('/source', os.O_RDONLY | os.O_DIRECTORY)
      destination_fd = os.open('/staged', os.O_RDONLY | os.O_DIRECTORY)
      try:
          os.fchown(destination_fd, 0, 0)
          os.fchmod(destination_fd, 0o700)
          with os.scandir(source_fd) as entries:
              source_entries = {entry.name: entry.stat(follow_symlinks=False) for entry in entries}
          if set(source_entries) != expected:
              raise RuntimeError('secret source does not match allowlist')
          for metadata in source_entries.values():
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_size > max_secret_bytes or stat.S_IMODE(metadata.st_mode) not in {0o400, 0o600}:
                  raise RuntimeError('secret source has unsafe metadata')

          with os.scandir(destination_fd) as entries:
              destination_entries = {entry.name: entry.stat(follow_symlinks=False) for entry in entries}
          permitted_destination_names = expected | {f'.stage-{name}' for name in expected}
          if not set(destination_entries) <= permitted_destination_names:
              raise RuntimeError('secret destination contains unexpected entries')
          for name, metadata in destination_entries.items():
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                  raise RuntimeError('secret destination has unsafe metadata')
              if name.startswith('.stage-'):
                  os.unlink(name, dir_fd=destination_fd)

          staged = []
          for name in sorted(expected):
              metadata = source_entries[name]
              source = os.open(name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=source_fd)
              temporary = f'.stage-{name}'
              destination = os.open(
                  temporary,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
                  dir_fd=destination_fd,
              )
              try:
                  opened = os.fstat(source)
                  if (opened.st_dev, opened.st_ino) != (metadata.st_dev, metadata.st_ino) or not stat.S_ISREG(opened.st_mode) or opened.st_nlink != 1 or opened.st_size > max_secret_bytes or stat.S_IMODE(opened.st_mode) not in {0o400, 0o600}:
                      raise RuntimeError('secret source changed during staging')
                  copied = 0
                  while chunk := os.read(source, min(65536, max_secret_bytes + 1 - copied)):
                      copied += len(chunk)
                      if copied > max_secret_bytes:
                          raise RuntimeError('secret source changed during staging')
                      remaining = memoryview(chunk)
                      while remaining:
                          remaining = remaining[os.write(destination, remaining):]
                  os.fchmod(destination, 0o600)
                  os.fchown(destination, 0, 0)
                  os.fsync(destination)
              finally:
                  os.close(destination)
                  os.close(source)
              staged.append((temporary, name))
          for temporary, name in staged:
              os.replace(temporary, name, src_dir_fd=destination_fd, dst_dir_fd=destination_fd)
          os.fsync(destination_fd)
      finally:
          os.close(destination_fd)
          os.close(source_fd)
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]
  network_mode: none
  restart: "no"

# Docker Desktop cannot carry a host Unix listener through a bind mount. Each
# local authority therefore gets one isolated signer container and one private
# named socket volume. Registry services receive the socket, never the key.
x-transit-signer: &transit-signer
  image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:-solmara-lab-scenario-runner:local}
  restart: unless-stopped
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  # Linux CI bind mounts retain the runner's ownership on the mode-0600 key.
  # Grant only the capability needed to read that one read-only bind. Hosted
  # signers stage operator-owned keys and do not use this local exception.
  cap_add: [DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]
  network_mode: none
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/transit/transit-proxy.sock'); s.close()"]
    interval: 2s
    timeout: 1s
    retries: 15

# Docker Desktop does not reliably invalidate SQLite pages held by a long-lived
# reader when the database is a host bind mount. Keep each authority's mutable
# publication on its own Linux volume, with a separate no-network publisher as
# the only writer. Relays receive only their authority volume and mount it RO.
x-relay-source-publisher: &relay-source-publisher
  image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  network_mode: none
  tmpfs: [/tmp]
  restart: "no"

# Native Linux preserves host ownership on bind mounts, while Relay accepts a
# runtime only when every path component is owned by root or its effective UID.
# Stage each authority's public runtime and sealed package into a dedicated
# volume so the official image can keep its fixed unprivileged identity.
x-relay-runtime-stager: &relay-runtime-stager
  image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
  entrypoint: ["python", "/app/local-relay-runtime-stager.py"]
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: [no-new-privileges:true]
  network_mode: none
  tmpfs: [/tmp]
  restart: "no"

x-evidence-client-environment: &evidence-client-environment
  SOLMARA_MINT_URL: https://mint.solmara.registrystack.org
  SOLMARA_MINT_ASSERTION_AUDIENCE: https://mint.solmara.registrystack.org/token
  SOLMARA_EVIDENCE_CLIENT_ID: solmara-demo
  SOLMARA_EVIDENCE_CLIENT_KEY: /run/secrets/solmara-evidence-client.jwk
  SOLMARA_EVIDENCE_CA_BUNDLE: /etc/solmara-evidence/tls/ca.crt
  SOLMARA_CRA_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/cra
  SOLMARA_NIA_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/nia
  SOLMARA_SRO_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/sro
  SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/mosd-programme
  SOLMARA_SIPF_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/sipf
  SOLMARA_NAGDI_EVIDENCE_URL: https://evidence.solmara.invalid/evidence/nagdi
  SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt

services:
  mint-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key]
    volumes: ["./runtime/evidence-cells/secrets/mint:/source:ro", "mint-runtime-secrets:/staged"]

  cra-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key, cra-pension-evidence-client-id, cra-pension-evidence-client-key, cra-citizen-evidence-client-id, cra-citizen-evidence-client-key]
    volumes: ["./runtime/evidence-cells/secrets/cra:/source:ro", "cra-evidence-runtime-secrets:/staged"]

  nia-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key]
    volumes: ["./runtime/evidence-cells/secrets/nia:/source:ro", "nia-evidence-runtime-secrets:/staged"]

  sro-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key]
    volumes: ["./runtime/evidence-cells/secrets/sro:/source:ro", "sro-evidence-runtime-secrets:/staged"]

  mosd-programme-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key, mosd-child-benefit-evidence-client-id, mosd-child-benefit-evidence-client-key]
    volumes: ["./runtime/evidence-cells/secrets/mosd-programme:/source:ro", "mosd-programme-evidence-runtime-secrets:/staged"]

  sipf-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key, sipf-pension-evidence-client-id, sipf-pension-evidence-client-key, sipf-survivor-evidence-client-id, sipf-survivor-evidence-client-key]
    volumes: ["./runtime/evidence-cells/secrets/sipf:/source:ro", "sipf-evidence-runtime-secrets:/staged"]

  nagdi-secret-stager:
    <<: *authority-secret-stager
    command: [stage, audit-hmac-key, subject-binding-hmac-key, nagdi-voucher-evidence-client-id, nagdi-voucher-evidence-client-key, nagdi-livestock-evidence-client-id, nagdi-livestock-evidence-client-key]
    volumes: ["./runtime/evidence-cells/secrets/nagdi:/source:ro", "nagdi-evidence-runtime-secrets:/staged"]

  cra-source-publisher:
    <<: *relay-source-publisher
    entrypoint: ["python", "/app/local-relay-source-publisher.py", "--authority", "cra", "--database", "/var/lib/relay/source/cra.sqlite", "--seed", "/seed/cra.sqlite"]
    command: ["ensure-seeded"]
    volumes: ["./scripts/local-relay-source-publisher.py:/app/local-relay-source-publisher.py:ro", "./generator/solmara_lab:/app/solmara_lab:ro", "./output/sqlite/relay/cra.sqlite:/seed/cra.sqlite:ro", "cra-relay-source:/var/lib/relay/source"]

  nia-source-publisher:
    <<: *relay-source-publisher
    entrypoint: ["python", "/app/local-relay-source-publisher.py", "--authority", "nia", "--database", "/var/lib/relay/source/nia.sqlite", "--seed", "/seed/nia.sqlite"]
    command: ["ensure-seeded"]
    volumes: ["./scripts/local-relay-source-publisher.py:/app/local-relay-source-publisher.py:ro", "./generator/solmara_lab:/app/solmara_lab:ro", "./output/sqlite/relay/nia.sqlite:/seed/nia.sqlite:ro", "nia-relay-source:/var/lib/relay/source"]

  mosd-source-publisher:
    <<: *relay-source-publisher
    entrypoint: ["python", "/app/local-relay-source-publisher.py", "--authority", "mosd", "--database", "/var/lib/relay/source/mosd.sqlite", "--seed", "/seed/mosd.sqlite"]
    command: ["ensure-seeded"]
    volumes: ["./scripts/local-relay-source-publisher.py:/app/local-relay-source-publisher.py:ro", "./generator/solmara_lab:/app/solmara_lab:ro", "./output/sqlite/relay/mosd.sqlite:/seed/mosd.sqlite:ro", "mosd-relay-source:/var/lib/relay/source"]

  sipf-source-publisher:
    <<: *relay-source-publisher
    entrypoint: ["python", "/app/local-relay-source-publisher.py", "--authority", "sipf", "--database", "/var/lib/relay/source/sipf.sqlite", "--seed", "/seed/sipf.sqlite"]
    command: ["ensure-seeded"]
    volumes: ["./scripts/local-relay-source-publisher.py:/app/local-relay-source-publisher.py:ro", "./generator/solmara_lab:/app/solmara_lab:ro", "./output/sqlite/relay/sipf.sqlite:/seed/sipf.sqlite:ro", "sipf-relay-source:/var/lib/relay/source"]

  nagdi-source-publisher:
    <<: *relay-source-publisher
    entrypoint: ["python", "/app/local-relay-source-publisher.py", "--authority", "nagdi", "--database", "/var/lib/relay/source/nagdi.sqlite", "--seed", "/seed/nagdi.sqlite"]
    command: ["ensure-seeded"]
    volumes: ["./scripts/local-relay-source-publisher.py:/app/local-relay-source-publisher.py:ro", "./generator/solmara_lab:/app/solmara_lab:ro", "./output/sqlite/relay/nagdi.sqlite:/seed/nagdi.sqlite:ro", "nagdi-relay-source:/var/lib/relay/source"]

  cra-relay-runtime-stager:
    <<: *relay-runtime-stager
    command: ["--authority", "cra", "--source", "/source", "--destination", "/staged", "stage"]
    volumes: ["./scripts/local-relay-runtime-stager.py:/app/local-relay-runtime-stager.py:ro", "./relays/cra/runtime.yaml:/source/runtime.yaml:ro", "./relays/cra/package:/source/package:ro", "cra-relay-runtime:/staged"]

  nia-relay-runtime-stager:
    <<: *relay-runtime-stager
    command: ["--authority", "nia", "--source", "/source", "--destination", "/staged", "stage"]
    volumes: ["./scripts/local-relay-runtime-stager.py:/app/local-relay-runtime-stager.py:ro", "./relays/nia/runtime.yaml:/source/runtime.yaml:ro", "./relays/nia/package:/source/package:ro", "nia-relay-runtime:/staged"]

  mosd-relay-runtime-stager:
    <<: *relay-runtime-stager
    command: ["--authority", "mosd", "--source", "/source", "--destination", "/staged", "stage"]
    volumes: ["./scripts/local-relay-runtime-stager.py:/app/local-relay-runtime-stager.py:ro", "./relays/mosd/runtime.yaml:/source/runtime.yaml:ro", "./relays/mosd/package:/source/package:ro", "mosd-relay-runtime:/staged"]

  sipf-relay-runtime-stager:
    <<: *relay-runtime-stager
    command: ["--authority", "sipf", "--source", "/source", "--destination", "/staged", "stage"]
    volumes: ["./scripts/local-relay-runtime-stager.py:/app/local-relay-runtime-stager.py:ro", "./relays/sipf/runtime.yaml:/source/runtime.yaml:ro", "./relays/sipf/package:/source/package:ro", "sipf-relay-runtime:/staged"]

  nagdi-relay-runtime-stager:
    <<: *relay-runtime-stager
    command: ["--authority", "nagdi", "--source", "/source", "--destination", "/staged", "stage"]
    volumes: ["./scripts/local-relay-runtime-stager.py:/app/local-relay-runtime-stager.py:ro", "./relays/nagdi/runtime.yaml:/source/runtime.yaml:ro", "./relays/nagdi/package:/source/package:ro", "nagdi-relay-runtime:/staged"]

  relay-audit-init:
    image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
    command:
      - python
      - -c
      - |-
        import os
        import re
        import stat

        target_uid = 65532
        target_gid = 65532
        paths = ['/audit/cra', '/audit/nia', '/audit/mosd', '/audit/sipf', '/audit/nagdi']
        for path in paths:
            # Reclaim the directory long enough to validate existing metadata.
            # The final chown returns it to Relay before this process exits.
            os.chown(path, 0, 0)
            os.chmod(path, 0o700)
            for entry in os.scandir(path):
                if entry.name not in {'audit.jsonl', 'audit.jsonl.lock'} and not re.fullmatch(r'audit\.jsonl\.\d{8}', entry.name):
                    continue
                metadata = entry.stat(follow_symlinks=False)
                if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                    raise RuntimeError('audit sink has unsafe metadata')
                os.chown(entry.path, target_uid, target_gid, follow_symlinks=False)
                os.chmod(entry.path, 0o600, follow_symlinks=False)
            os.chown(path, target_uid, target_gid)
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"
    volumes:
      - cra-relay-audit:/audit/cra
      - nia-relay-audit:/audit/nia
      - mosd-relay-audit:/audit/mosd
      - sipf-relay-audit:/audit/sipf
      - nagdi-relay-audit:/audit/nagdi

  authority-audit-init:
    image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
    command:
      - python
      - -c
      - |-
        import os
        import re
        import stat

        paths = ['/audit/mint', '/audit/cra', '/audit/nia', '/audit/sro', '/audit/mosd-programme', '/audit/sipf', '/audit/nagdi']
        for path in paths:
            metadata = os.lstat(path)
            if not stat.S_ISDIR(metadata.st_mode):
                raise RuntimeError('audit sink has unsafe metadata')
            os.chown(path, 0, 0)
            os.chmod(path, 0o700)
        mint_chain = '/audit/mint/audit'
        try:
            os.mkdir(mint_chain, 0o700)
        except FileExistsError:
            pass
        metadata = os.lstat(mint_chain)
        if not stat.S_ISDIR(metadata.st_mode):
            raise RuntimeError('audit sink has unsafe metadata')
        os.chown(mint_chain, 0, 0)
        os.chmod(mint_chain, 0o700)
        audit_files = {
            '/audit/cra': 'evidence.jsonl',
            '/audit/nia': 'evidence.jsonl',
            '/audit/sro': 'evidence.jsonl',
            '/audit/mosd-programme': 'evidence.jsonl',
            '/audit/sipf': 'evidence.jsonl',
            '/audit/nagdi': 'evidence.jsonl',
            mint_chain: 'mint.jsonl',
        }
        for path, active_name in audit_files.items():
            with os.scandir(path) as entries:
                for entry in entries:
                    if entry.name not in {active_name, active_name + '.lock'} and not re.fullmatch(re.escape(active_name) + r'\.\d{8}', entry.name):
                        continue
                    metadata = entry.stat(follow_symlinks=False)
                    if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                        raise RuntimeError('audit sink has unsafe metadata')
                    os.chown(entry.path, 0, 0, follow_symlinks=False)
                    os.chmod(entry.path, 0o600, follow_symlinks=False)
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"
    volumes:
      - mint-v2-audit:/audit/mint
      - cra-evidence-audit:/audit/cra
      - nia-evidence-audit:/audit/nia
      - sro-evidence-audit:/audit/sro
      - mosd-evidence-audit:/audit/mosd-programme
      - sipf-evidence-audit:/audit/sipf
      - nagdi-evidence-audit:/audit/nagdi

  # A fresh Relay can create its audit chain before OIDC discovery completes.
  # If discovery then fails, the interrupted empty chain makes every later
  # consultation fail closed. Prove the shared issuer through the same strict
  # TEST-NET gateway path before any Relay process is allowed to start.
  relay-issuer-readiness:
    image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
    command:
      - python
      - -c
      - |-
        import json
        import ssl
        import time
        import urllib.request

        issuer = 'https://mint.solmara.registrystack.org'
        deadline = time.monotonic() + 60
        context = ssl.create_default_context(cafile='/etc/solmara-evidence/tls/ca.crt')
        while True:
            try:
                with urllib.request.urlopen(
                    issuer + '/.well-known/openid-configuration',
                    context=context,
                    timeout=5,
                ) as response:
                    document = json.load(response)
                if response.status == 200 and document.get('issuer') == issuer:
                    break
            except Exception:
                pass
            if time.monotonic() >= deadline:
                raise SystemExit('Relay issuer is unavailable')
            time.sleep(1)
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    volumes: ["./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro"]
    networks: [issuer-validation]
    depends_on:
      mint: {condition: service_started}
      evidence-gateway: {condition: service_started}

  mint-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-mint", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/mint/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "mint-transit:/transit"]

  cra-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-cra", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/cra/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "cra-transit:/transit"]

  nia-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-nia", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/nia/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "nia-transit:/transit"]

  sro-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-sro", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/sro/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "sro-transit:/transit"]

  mosd-programme-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-mosd-programme", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/mosd-programme/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "mosd-programme-transit:/transit"]

  sipf-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-sipf", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/sipf/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "sipf-transit:/transit"]

  nagdi-signer:
    <<: *transit-signer
    command: ["python", "/app/local-transit-proxy.py", "--private-jwk", "/run/secrets/signing.jwk", "--socket", "/transit/transit-proxy.sock", "--key-name", "solmara-evidence-nagdi", "--allow-root-bind-owner"]
    volumes: ["./scripts/local-transit-proxy.py:/app/local-transit-proxy.py:ro", "./config/evidence/local/cells/nagdi/secrets/signing.jwk:/run/secrets/signing.jwk:ro", "nagdi-transit:/transit"]

  static-metadata:
    image: ${PYTHON_STATIC_IMAGE:?versions.env must pin the static server image}
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/srv/static"]
    volumes: ["./metadata/public:/srv/static:ro"]
    ports: ["${SOLMARA_METADATA_PORT:-4331}:8080"]
    networks: [runtime]

  cra-relay:
    <<: *relay
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${CRA_RELAY_AUDIT_KEY:?run just gen-secrets}", SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt}
    command: ["serve", "--runtime", "/etc/relay/cra/runtime.yaml"]
    volumes: ["cra-relay-runtime:/etc/relay/cra:ro", "cra-relay-source:/var/lib/relay/source:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "cra-relay-audit:/var/lib/relay/audit"]
    depends_on: {relay-audit-init: {condition: service_completed_successfully}, relay-issuer-readiness: {condition: service_completed_successfully}, cra-source-publisher: {condition: service_completed_successfully}, cra-relay-runtime-stager: {condition: service_completed_successfully}}
    ports: ["${SOLMARA_CRA_RELAY_PORT:-4311}:8080"]

  nia-relay:
    <<: *relay
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${NIA_RELAY_AUDIT_KEY:?run just gen-secrets}", SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt}
    command: ["serve", "--runtime", "/etc/relay/nia/runtime.yaml"]
    volumes: ["nia-relay-runtime:/etc/relay/nia:ro", "nia-relay-source:/var/lib/relay/source:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "nia-relay-audit:/var/lib/relay/audit"]
    depends_on: {relay-audit-init: {condition: service_completed_successfully}, relay-issuer-readiness: {condition: service_completed_successfully}, nia-source-publisher: {condition: service_completed_successfully}, nia-relay-runtime-stager: {condition: service_completed_successfully}}
    ports: ["${SOLMARA_NIA_RELAY_PORT:-4312}:8080"]

  mosd-relay:
    <<: *relay
    environment: {SOLMARA_RELAY_AUDIT_KEY: "${MOSD_RELAY_AUDIT_KEY:?run just gen-secrets}", SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt}
    command: ["serve", "--runtime", "/etc/relay/mosd/runtime.yaml"]
    volumes: ["mosd-relay-runtime:/etc/relay/mosd:ro", "mosd-relay-source:/var/lib/relay/source:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "mosd-relay-audit:/var/lib/relay/audit"]
    depends_on: {relay-audit-init: {condition: service_completed_successfully}, relay-issuer-readiness: {condition: service_completed_successfully}, mosd-source-publisher: {condition: service_completed_successfully}, mosd-relay-runtime-stager: {condition: service_completed_successfully}}
    ports: ["${SOLMARA_MOSD_RELAY_PORT:-4314}:8080"]

  sipf-relay:
    <<: *relay
    environment:
      SOLMARA_RELAY_AUDIT_KEY: ${SIPF_RELAY_AUDIT_KEY:?run just gen-secrets}
      SOLMARA_RELAY_CURSOR_KEY: ${SIPF_RELAY_CURSOR_KEY:?run just gen-secrets}
      SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt
    command: ["serve", "--runtime", "/etc/relay/sipf/runtime.yaml"]
    volumes: ["sipf-relay-runtime:/etc/relay/sipf:ro", "sipf-relay-source:/var/lib/relay/source:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "sipf-relay-audit:/var/lib/relay/audit"]
    depends_on: {relay-audit-init: {condition: service_completed_successfully}, relay-issuer-readiness: {condition: service_completed_successfully}, sipf-source-publisher: {condition: service_completed_successfully}, sipf-relay-runtime-stager: {condition: service_completed_successfully}}
    ports: ["${SOLMARA_SIPF_RELAY_PORT:-4315}:8080"]

  nagdi-relay:
    <<: *relay
    environment:
      SOLMARA_RELAY_AUDIT_KEY: ${NAGDI_RELAY_AUDIT_KEY:?run just gen-secrets}
      SOLMARA_RELAY_CURSOR_KEY: ${NAGDI_RELAY_CURSOR_KEY:?run just gen-secrets}
      SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt
    command: ["serve", "--runtime", "/etc/relay/nagdi/runtime.yaml"]
    volumes: ["nagdi-relay-runtime:/etc/relay/nagdi:ro", "nagdi-relay-source:/var/lib/relay/source:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "nagdi-relay-audit:/var/lib/relay/audit"]
    depends_on: {relay-audit-init: {condition: service_completed_successfully}, relay-issuer-readiness: {condition: service_completed_successfully}, nagdi-source-publisher: {condition: service_completed_successfully}, nagdi-relay-runtime-stager: {condition: service_completed_successfully}}
    ports: ["${SOLMARA_NAGDI_RELAY_PORT:-4316}:8080"]

  mint:
    image: ${SOLMARA_MINT_IMAGE:?versions.env must name the digest-pinned official Registry Stack Mint image}
    platform: linux/amd64
    command: ["serve", "--config", "/etc/registry-mint/mint.yaml"]
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./runtime/evidence-cells/mint:/etc/registry-mint:ro
      - mint-runtime-secrets:/run/secrets/registry-mint:ro
      - mint-transit:/run/registry-mint:ro
      - mint-v2-audit:/var/lib/registry-mint
    networks:
      runtime: {ipv4_address: 172.29.1.20}
    depends_on: {mint-signer: {condition: service_healthy}, mint-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}}

  cra-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/cra/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/cra:/etc/registry-evidence/cra:ro", "cra-evidence-runtime-secrets:/run/secrets/registry-evidence/cra:ro", "cra-transit:/run/registry-evidence/cra:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "./output/sqlite/evidence:/var/lib/registry-evidence/cra/extracts:ro", "cra-evidence-audit:/var/lib/registry-evidence/cra/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.21}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, cra-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, cra-signer: {condition: service_healthy}, cra-relay: {condition: service_healthy}}

  nia-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/nia/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/nia:/etc/registry-evidence/nia:ro", "nia-evidence-runtime-secrets:/run/secrets/registry-evidence/nia:ro", "nia-transit:/run/registry-evidence/nia:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "./output/sqlite/evidence:/var/lib/registry-evidence/nia/extracts:ro", "nia-evidence-audit:/var/lib/registry-evidence/nia/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.22}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, nia-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, nia-signer: {condition: service_healthy}}

  sro-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/sro/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/sro:/etc/registry-evidence/sro:ro", "sro-evidence-runtime-secrets:/run/secrets/registry-evidence/sro:ro", "sro-transit:/run/registry-evidence/sro:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "./output/sqlite/evidence:/var/lib/registry-evidence/sro/extracts:ro", "sro-evidence-audit:/var/lib/registry-evidence/sro/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.23}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, sro-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, sro-signer: {condition: service_healthy}}

  mosd-programme-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/mosd-programme/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/mosd-programme:/etc/registry-evidence/mosd-programme:ro", "mosd-programme-evidence-runtime-secrets:/run/secrets/registry-evidence/mosd-programme:ro", "mosd-programme-transit:/run/registry-evidence/mosd-programme:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "mosd-evidence-audit:/var/lib/registry-evidence/mosd-programme/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.24}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, mosd-programme-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, mosd-programme-signer: {condition: service_healthy}, mosd-relay: {condition: service_healthy}}

  sipf-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/sipf/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/sipf:/etc/registry-evidence/sipf:ro", "sipf-evidence-runtime-secrets:/run/secrets/registry-evidence/sipf:ro", "sipf-transit:/run/registry-evidence/sipf:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "sipf-evidence-audit:/var/lib/registry-evidence/sipf/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.25}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, sipf-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, sipf-signer: {condition: service_healthy}, sipf-relay: {condition: service_healthy}}

  nagdi-evidence:
    <<: *evidence
    command: ["--runtime", "/etc/registry-evidence/nagdi/runtime.yaml", "serve"]
    volumes: ["./runtime/evidence-cells/cells/nagdi:/etc/registry-evidence/nagdi:ro", "nagdi-evidence-runtime-secrets:/run/secrets/registry-evidence/nagdi:ro", "nagdi-transit:/run/registry-evidence/nagdi:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro", "nagdi-evidence-audit:/var/lib/registry-evidence/nagdi/audit"]
    networks: {runtime: {ipv4_address: 172.29.1.26}, issuer-validation: {}}
    depends_on: {mint: {condition: service_started}, nagdi-secret-stager: {condition: service_completed_successfully}, authority-audit-init: {condition: service_completed_successfully}, nagdi-signer: {condition: service_healthy}, nagdi-relay: {condition: service_healthy}}

  evidence-gateway:
    image: ${EVIDENCE_GATEWAY_IMAGE:?versions.env must pin Caddy}
    user: "0:0"
    restart: unless-stopped
    ports: ["${SOLMARA_EVIDENCE_GATEWAY_PORT:-4341}:443"]
    volumes: ["./config/evidence/Caddyfile:/etc/caddy/Caddyfile:ro", "./config/evidence/local/tls:/etc/solmara-evidence/tls:ro", "caddy-data:/data", "caddy-config:/config"]
    networks:
      runtime:
        ipv4_address: 172.29.1.10
        aliases:
          - evidence.solmara.invalid
          - cra-relay.solmara.registrystack.org
          - mosd-programme-relay.solmara.registrystack.org
          - sipf-relay.solmara.registrystack.org
          - nagdi-relay.solmara.registrystack.org
      # Relay's production OIDC fetch policy rejects private, loopback, and
      # metadata destinations. TEST-NET-1 gives the hermetic local gateway a
      # non-routable issuer address without weakening that runtime policy.
      issuer-validation:
        ipv4_address: 192.0.2.62
        aliases: [mint.solmara.registrystack.org]

  child-benefit-federator:
    build: {context: ., dockerfile: scenario-runner/Dockerfile}
    image: ${SOLMARA_CHILD_BENEFIT_FEDERATOR_IMAGE:-solmara-lab-scenario-runner:local}
    command: ["python", "scenario-runner/child_benefit_federator.py"]
    environment:
      <<: *evidence-client-environment
      CHILD_BENEFIT_FEDERATOR_HOST: 0.0.0.0
      CHILD_BENEFIT_FEDERATOR_PORT: "8080"
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN:?run just gen-secrets}
    volumes: ["./config/evidence/local/cells/mint/clients/solmara-demo-client-key:/run/secrets/solmara-evidence-client.jwk:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro"]
    networks: [runtime, issuer-validation]

  scenario-runner:
    build: {context: ., dockerfile: scenario-runner/Dockerfile}
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:-solmara-lab-scenario-runner:local}
    environment:
      <<: *evidence-client-environment
      SCENARIO_RUNNER_HOST: 0.0.0.0
      SCENARIO_RUNNER_PORT: "8080"
      SOLMARA_LAB_MODE: local
      CHILD_BENEFIT_FEDERATOR_URL: http://child-benefit-federator:8080
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN:?run just gen-secrets}
    volumes: ["./config/evidence/local/cells/mint/clients/solmara-demo-client-key:/run/secrets/solmara-evidence-client.jwk:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro"]
    networks: [runtime, issuer-validation]

  portal:
    build: {context: ./portal}
    image: ${SOLMARA_PORTAL_IMAGE:-solmara-lab-portal:local}
    environment:
      <<: *evidence-client-environment
      HOST: 0.0.0.0
      PORT: "4000"
      PORTAL_PROVIDER: live
      PORTAL_AUTH_PROVIDER: ${PORTAL_AUTH_PROVIDER:-mock}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:?run just gen-secrets}
      CHILD_BENEFIT_FEDERATOR_URL: http://child-benefit-federator:8080
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN:?run just gen-secrets}
      SCENARIO_RUNNER_URL: http://scenario-runner:8080
    ports: ["${SOLMARA_PORTAL_PORT:-4300}:4000"]
    volumes: ["./config/evidence/local/cells/mint/clients/solmara-demo-client-key:/run/secrets/solmara-evidence-client.jwk:ro", "./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro"]
    networks: [runtime, issuer-validation]

  home:
    build: {context: ., dockerfile: home/Dockerfile}
    image: ${SOLMARA_HOME_IMAGE:-solmara-lab-home:local}
    environment:
      HOST: 0.0.0.0
      PORT: "4301"
      SOLMARA_LAB_ROOT: /app
      PORTAL_URL: "http://127.0.0.1:${SOLMARA_PORTAL_PORT:-4300}"
      STATIC_METADATA_URL: "http://static-metadata:8080"
      CRA_CIVIL_RELAY_URL: "http://cra-relay:8080"
      NIA_POPULATION_RELAY_URL: "http://nia-relay:8080"
      MOSD_PROGRAMME_RELAY_URL: "http://mosd-relay:8080"
      SIPF_PENSIONS_RELAY_URL: "http://sipf-relay:8080"
      NAGDI_AGRICULTURE_RELAY_URL: "http://nagdi-relay:8080"
      SOLMARA_CRA_EVIDENCE_URL: "http://cra-evidence:8080"
      SOLMARA_NIA_EVIDENCE_URL: "http://nia-evidence:8080"
      SOLMARA_SRO_EVIDENCE_URL: "http://sro-evidence:8080"
      SOLMARA_MOSD_PROGRAMME_EVIDENCE_URL: "http://mosd-programme-evidence:8080"
      SOLMARA_SIPF_EVIDENCE_URL: "http://sipf-evidence:8080"
      SOLMARA_NAGDI_EVIDENCE_URL: "http://nagdi-evidence:8080"
      MINT_URL: "http://mint:8081"
      CHILD_BENEFIT_FEDERATOR_URL: "http://child-benefit-federator:8080"
      SCENARIO_RUNNER_URL: "http://scenario-runner:8080"
      PORTAL_PROBE_URL: "http://portal:4000"
    ports: ["${SOLMARA_HOME_PORT:-4301}:4301"]
    volumes: ["./output/smoke:/app/output/smoke:ro", "./generator/output:/app/generator/output:ro"]
    networks: [runtime]

volumes:
  mint-runtime-secrets:
  cra-evidence-runtime-secrets:
  nia-evidence-runtime-secrets:
  sro-evidence-runtime-secrets:
  mosd-programme-evidence-runtime-secrets:
  sipf-evidence-runtime-secrets:
  nagdi-evidence-runtime-secrets:
  cra-relay-runtime:
  nia-relay-runtime:
  mosd-relay-runtime:
  sipf-relay-runtime:
  nagdi-relay-runtime:
  cra-relay-source:
  nia-relay-source:
  mosd-relay-source:
  sipf-relay-source:
  nagdi-relay-source:
  mint-transit:
  cra-transit:
  nia-transit:
  sro-transit:
  mosd-programme-transit:
  sipf-transit:
  nagdi-transit:
  cra-relay-audit:
  nia-relay-audit:
  mosd-relay-audit:
  sipf-relay-audit:
  nagdi-relay-audit:
  cra-evidence-audit:
  nia-evidence-audit:
  sro-evidence-audit:
  mosd-evidence-audit:
  sipf-evidence-audit:
  nagdi-evidence-audit:
  mint-v2-audit:
  caddy-data:
  caddy-config:

networks:
  runtime:
    ipam: {config: [{subnet: 172.29.1.0/24}]}
  issuer-validation:
    internal: true
    ipam: {config: [{subnet: 192.0.2.0/26, ip_range: 192.0.2.0/27}]}
