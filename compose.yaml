x-relay-environment: &relay-environment
  RUST_LOG: ${RUST_LOG:-info}
  REGISTRY_RELAY_BIND: 0.0.0.0:8080

x-relay-common: &relay-common
  image: ${REGISTRY_RELAY_IMAGE:?versions.env must name the locally built Registry Stack main Relay image}
  restart: unless-stopped
  environment: *relay-environment
  healthcheck:
    test: ["CMD", "/usr/local/bin/registry-relay", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 12

x-workload-agent-common: &workload-agent-common
  build:
    context: .
    dockerfile: scenario-runner/Dockerfile
  image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:-solmara-lab-scenario-runner:local}
  command: ["python", "scripts/relay_workload_identity_agent.py"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
    interval: 5s
    timeout: 5s
    retries: 12

x-evidence-client-environment: &evidence-client-environment
  SOLMARA_EVIDENCE_URL: https://evidence.solmara.invalid
  SOLMARA_MINT_URL: https://mint.evidence.solmara.invalid
  SOLMARA_MINT_ASSERTION_AUDIENCE: https://mint.evidence.solmara.invalid/token
  SOLMARA_EVIDENCE_CLIENT_ID: solmara-demo
  SOLMARA_EVIDENCE_CLIENT_KEY: /run/secrets/solmara-evidence-client.jwk
  SOLMARA_EVIDENCE_CA_BUNDLE: /etc/solmara-evidence/tls/ca.crt
  SSL_CERT_FILE: /etc/solmara-evidence/tls/ca.crt

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    entrypoint: ["/bin/sh", "/usr/local/bin/solmara-postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server-ssl/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server-ssl/server.key
    environment:
      POSTGRES_USER: ${SOLMARA_POSTGRES_USER:-solmara_registry}
      POSTGRES_PASSWORD: ${SOLMARA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOLMARA_POSTGRES_DB:-solmara_lab}
      SOLMARA_SOURCE_READER_DATABASES: nia sipf
      NIA_SOURCE_POSTGRES_READER_PASSWORD: ${NIA_SOURCE_POSTGRES_READER_PASSWORD}
      SIPF_SOURCE_POSTGRES_READER_PASSWORD: ${SIPF_SOURCE_POSTGRES_READER_PASSWORD}
    ports:
      - "${SOLMARA_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ministries/interior-population/fixtures/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./ministries/interior-population/fixtures/002-load.sql:/docker-entrypoint-initdb.d/002-load.sql:ro
      - ./ministries/interior-population/fixtures/population_person.csv:/docker-entrypoint-initdb.d/population_person.csv:ro
      - ./ministries/interior-population/fixtures/identity_document.csv:/docker-entrypoint-initdb.d/identity_document.csv:ro
      - ./ministries/interior-population/fixtures/consent_directive.csv:/docker-entrypoint-initdb.d/consent_directive.csv:ro
      - ./ministries/labour-pensions/fixtures/003-schema.sql:/docker-entrypoint-initdb.d/003-schema.sql:ro
      - ./ministries/labour-pensions/fixtures/004-load.sql:/docker-entrypoint-initdb.d/004-load.sql:ro
      - ./ministries/labour-pensions/fixtures/pension_case.csv:/docker-entrypoint-initdb.d/pension_case.csv:ro
      - ./scripts/init-registry-postgresql.sh:/usr/local/bin/solmara-provision-postgresql.sh:ro
      - ./scripts/postgres-entrypoint.sh:/usr/local/bin/solmara-postgres-entrypoint.sh:ro
      - ./config/postgres/ssl:/run/solmara-postgres-ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/solmara-postgres-provisioned && pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  static-metadata:
    image: ${STATIC_METADATA_IMAGE:-python:3.12-alpine}
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/srv/static"]
    ports:
      - "${SOLMARA_METADATA_PORT:-4331}:8080"
    volumes:
      - ./metadata/public:/srv/static:ro

  cra-civil-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${CRA_RELAY_AUDIT_HASH_SECRET}
    ports: ["${SOLMARA_CRA_RELAY_PORT:-4311}:8080"]
    volumes:
      - ./runtime/registry-projects/local/cra-civil/relay:/etc/registry-relay:ro
      - ./ministries/interior-civil:/var/lib/solmara/ministries/interior-civil:ro
      - cra-relay-cache:/var/lib/registry-relay/cache

  nia-population-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${NIA_RELAY_AUDIT_HASH_SECRET}
      SOLMARA_NIA_DATABASE_URL: ${SOLMARA_NIA_DATABASE_URL}
      DATA_GATE_POSTGRES_ROOT_CERT_PATH: /etc/solmara/postgres/root.crt
    ports: ["${SOLMARA_NIA_RELAY_PORT:-4312}:8080"]
    volumes:
      - ./runtime/registry-projects/local/nia-population/relay:/etc/registry-relay:ro
      - ./config/postgres/ssl/server.crt:/etc/solmara/postgres/root.crt:ro
      - nia-relay-cache:/var/lib/registry-relay/cache
    depends_on:
      postgres: { condition: service_healthy }

  sro-social-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${SRO_RELAY_AUDIT_HASH_SECRET}
    ports: ["${SOLMARA_SRO_RELAY_PORT:-4313}:8080"]
    volumes:
      - ./runtime/registry-projects/local/sro-social/relay:/etc/registry-relay:ro
      - ./ministries/social-development:/var/lib/solmara/ministries/social-development:ro
      - sro-relay-cache:/var/lib/registry-relay/cache

  programme-mis-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${PROGRAMME_RELAY_AUDIT_HASH_SECRET}
    ports: ["${SOLMARA_PROGRAMME_RELAY_PORT:-4314}:8080"]
    volumes:
      - ./runtime/registry-projects/local/mosd-programme/relay:/etc/registry-relay:ro
      - ./ministries/social-development:/var/lib/solmara/ministries/social-development:ro
      - programme-relay-cache:/var/lib/registry-relay/cache

  sipf-pensions-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${SIPF_RELAY_AUDIT_HASH_SECRET}
      SOLMARA_SIPF_DATABASE_URL: ${SOLMARA_SIPF_DATABASE_URL}
      DATA_GATE_POSTGRES_ROOT_CERT_PATH: /etc/solmara/postgres/root.crt
    ports: ["${SOLMARA_SIPF_RELAY_PORT:-4315}:8080"]
    volumes:
      - ./runtime/registry-projects/local/sipf-pensions/relay:/etc/registry-relay:ro
      - ./config/postgres/ssl/server.crt:/etc/solmara/postgres/root.crt:ro
      - sipf-relay-cache:/var/lib/registry-relay/cache
    depends_on:
      postgres: { condition: service_healthy }

  nagdi-agriculture-relay:
    <<: *relay-common
    command: ["--config", "/etc/registry-relay/relay.yaml"]
    environment:
      <<: *relay-environment
      REGISTRY_RELAY_AUDIT_HASH_SECRET: ${NAGDI_RELAY_AUDIT_HASH_SECRET}
    ports: ["${SOLMARA_NAGDI_RELAY_PORT:-4316}:8080"]
    volumes:
      - ./runtime/registry-projects/local/nagdi-agriculture/relay:/etc/registry-relay:ro
      - ./ministries/agriculture-nagdi:/var/lib/solmara/ministries/agriculture-nagdi:ro
      - nagdi-relay-cache:/var/lib/registry-relay/cache

  evidence-secrets-init:
    image: ${VOLUME_INIT_IMAGE:?versions.env must pin the volume init image}
    restart: "no"
    command:
      - sh
      - -ec
      - |
        install_secret() {
          name="$$1"
          if [ -e "/target/$$name" ]; then
            cmp -s "/seed/$$name" "/target/$$name" || {
              echo "retained Evidence secret $$name differs from the generated seed; refusing replacement" >&2
              exit 1
            }
          else
            cp "/seed/$$name" "/target/$$name"
            chown 65532:65532 "/target/$$name"
            chmod 600 "/target/$$name"
          fi
        }
        chown 65532:65532 /target /audit
        chmod 700 /target /audit
        install_secret audit-hmac-key
        install_secret subject-binding-hmac-key
        install_secret signing-p256-private-jwk
        rm -f /target/signing-ed25519-private-jwk
    volumes:
      - ./config/evidence/local/evidence:/seed:ro
      - evidence-secrets:/target
      - evidence-audit:/audit

  evidence-audit-migrate:
    image: ${STATIC_METADATA_IMAGE:?versions.env must pin the local audit migration Python image}
    restart: "no"
    command: ["python", "/usr/local/bin/migrate-local-audit.py", "--audit-path", "/audit/evidence.jsonl", "--key-file", "/secrets/audit-hmac-key", "--legacy-key-mode", "exact"]
    volumes:
      - ./scripts/migrate-local-audit.py:/usr/local/bin/migrate-local-audit.py:ro
      - evidence-secrets:/secrets:ro
      - evidence-audit:/audit
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }

  cra-workload-agent:
    <<: *workload-agent-common
    network_mode: service:cra-civil-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["civil_people:rows"],"token_file":"/run/evidence-secrets/cra-relay-token","private_jwk_env":"CRA_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      CRA_RELAY_WORKLOAD_JWK: ${CRA_RELAY_WORKLOAD_JWK}
    volumes: [evidence-secrets:/run/evidence-secrets]
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      cra-civil-relay: { condition: service_started }

  nia-workload-agent:
    <<: *workload-agent-common
    network_mode: service:nia-population-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["population:rows"],"token_file":"/run/evidence-secrets/nia-relay-token","private_jwk_env":"NIA_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532},
        {"audience":"registry-relay","azp":"solmara-esignet","subject":"solmara-esignet","scopes":["population:identity_release"],"token_file":"/run/esignet-secrets/solmara-esignet-relay-token","private_jwk_env":"NIA_ESIGNET_RELAY_WORKLOAD_JWK","token_uid":1001,"token_gid":1001}]
      NIA_RELAY_WORKLOAD_JWK: ${NIA_RELAY_WORKLOAD_JWK}
      NIA_ESIGNET_RELAY_WORKLOAD_JWK: ${NIA_ESIGNET_RELAY_WORKLOAD_JWK}
    volumes:
      - evidence-secrets:/run/evidence-secrets
      - nia-esignet-workload-token:/run/esignet-secrets
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      nia-population-relay: { condition: service_started }

  sro-workload-agent:
    <<: *workload-agent-common
    network_mode: service:sro-social-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["sro_child:rows"],"token_file":"/run/evidence-secrets/sro-relay-token","private_jwk_env":"SRO_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      SRO_RELAY_WORKLOAD_JWK: ${SRO_RELAY_WORKLOAD_JWK}
    volumes: [evidence-secrets:/run/evidence-secrets]
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      sro-social-relay: { condition: service_started }

  programme-workload-agent:
    <<: *workload-agent-common
    network_mode: service:programme-mis-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["mosd_enroll:rows"],"token_file":"/run/evidence-secrets/programme-relay-token","private_jwk_env":"PROGRAMME_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      PROGRAMME_RELAY_WORKLOAD_JWK: ${PROGRAMME_RELAY_WORKLOAD_JWK}
    volumes: [evidence-secrets:/run/evidence-secrets]
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      programme-mis-relay: { condition: service_started }

  sipf-workload-agent:
    <<: *workload-agent-common
    network_mode: service:sipf-pensions-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["pension:rows","survivor:rows"],"token_file":"/run/evidence-secrets/sipf-relay-token","private_jwk_env":"SIPF_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      SIPF_RELAY_WORKLOAD_JWK: ${SIPF_RELAY_WORKLOAD_JWK}
    volumes: [evidence-secrets:/run/evidence-secrets]
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      sipf-pensions-relay: { condition: service_started }

  nagdi-workload-agent:
    <<: *workload-agent-common
    network_mode: service:nagdi-agriculture-relay
    environment:
      WORKLOAD_ISSUER: http://127.0.0.1:8090
      WORKLOAD_IDENTITIES_JSON: >-
        [{"audience":"registry-relay","azp":"solmara-evidence","subject":"solmara-evidence","scopes":["nagdi_farmer:rows","nagdi_herd:rows"],"token_file":"/run/evidence-secrets/nagdi-relay-token","private_jwk_env":"NAGDI_RELAY_WORKLOAD_JWK","token_uid":65532,"token_gid":65532}]
      NAGDI_RELAY_WORKLOAD_JWK: ${NAGDI_RELAY_WORKLOAD_JWK}
    volumes: [evidence-secrets:/run/evidence-secrets]
    depends_on:
      evidence-secrets-init: { condition: service_completed_successfully }
      nagdi-agriculture-relay: { condition: service_started }

  mint-secrets-init:
    image: ${VOLUME_INIT_IMAGE:?versions.env must pin the volume init image}
    restart: "no"
    command:
      - sh
      - -ec
      - |
        install_secret() {
          name="$$1"
          if [ -e "/target/$$name" ]; then
            cmp -s "/seed/$$name" "/target/$$name" || {
              echo "retained Mint secret $$name differs from the generated seed; refusing replacement" >&2
              exit 1
            }
          else
            cp "/seed/$$name" "/target/$$name"
            chown 65532:65532 "/target/$$name"
            chmod 600 "/target/$$name"
          fi
        }
        install_signing_secret() {
          if [ ! -e /target/signing.jwk ]; then
            install_secret signing.jwk
          elif cmp -s /seed/signing.jwk /target/signing.jwk; then
            return
          elif grep -Eq '"kty"[[:space:]]*:[[:space:]]*"OKP"' /target/signing.jwk && grep -Eq '"crv"[[:space:]]*:[[:space:]]*"Ed25519"' /target/signing.jwk; then
            cp /seed/signing.jwk /target/.signing.jwk.v018
            chown 65532:65532 /target/.signing.jwk.v018
            chmod 600 /target/.signing.jwk.v018
            mv /target/.signing.jwk.v018 /target/signing.jwk
          else
            echo "retained Mint signing.jwk differs from the generated seed; refusing replacement" >&2
            exit 1
          fi
        }
        chown 65532:65532 /target /audit
        chmod 700 /target /audit
        install_signing_secret
        install_secret audit-hmac-key
    volumes:
      - ./config/evidence/local/mint:/seed:ro
      - mint-secrets:/target
      - mint-audit:/audit

  mint-audit-migrate:
    image: ${STATIC_METADATA_IMAGE:?versions.env must pin the local audit migration Python image}
    restart: "no"
    command: ["python", "/usr/local/bin/migrate-local-audit.py", "--audit-path", "/audit/mint.jsonl", "--key-file", "/secrets/audit-hmac-key", "--legacy-key-mode", "trim-newlines"]
    volumes:
      - ./scripts/migrate-local-audit.py:/usr/local/bin/migrate-local-audit.py:ro
      - mint-secrets:/secrets:ro
      - mint-audit:/audit
    depends_on:
      mint-secrets-init: { condition: service_completed_successfully }

  mint:
    image: ${SOLMARA_MINT_IMAGE:?versions.env must name the Registry Stack v0.18.0 release-binary Mint image}
    restart: unless-stopped
    command: ["serve", "--config", "/etc/registry-mint/config.yaml"]
    volumes:
      - ./config/evidence/local/mint/mint.yaml:/etc/registry-mint/config.yaml:ro
      - ./config/evidence/local/mint/public-keys:/etc/registry-mint/public-keys:ro
      - ./config/evidence/local/mint/clients:/etc/registry-mint/clients:ro
      - mint-secrets:/run/secrets/registry-mint:ro
      - mint-audit:/var/lib/registry-mint/audit
    networks: [evidence]
    depends_on:
      mint-audit-migrate: { condition: service_completed_successfully }

  evidence-gateway:
    image: ${EVIDENCE_GATEWAY_IMAGE:?versions.env must pin the Evidence TLS gateway image}
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${SOLMARA_EVIDENCE_GATEWAY_PORT:-4341}:443"
    volumes:
      - ./evidence/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/evidence/local/tls:/etc/solmara-evidence/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default: {}
      evidence:
        aliases:
          - mint.evidence.solmara.invalid
          - evidence.solmara.invalid
          - cra-relay.evidence.solmara.invalid
          - nia-relay.evidence.solmara.invalid
          - sro-relay.evidence.solmara.invalid
          - programme-relay.evidence.solmara.invalid
          - sipf-relay.evidence.solmara.invalid
          - nagdi-relay.evidence.solmara.invalid

  evidence:
    image: ${SOLMARA_EVIDENCE_IMAGE:?versions.env must name the Registry Stack v0.18.0 release-binary Evidence image}
    restart: unless-stopped
    command: ["--runtime", "/etc/registry-evidence/runtime.yaml", "serve"]
    environment:
      SSL_CERT_FILE: /etc/registry-evidence/tls/lab-ca.crt
    volumes:
      - ./evidence/runtime.yaml:/etc/registry-evidence/runtime.yaml:ro
      - ./evidence/bundle:/etc/registry-evidence/bundle:ro
      - ./config/evidence/local/evidence/evidence.yaml:/etc/registry-evidence/bundle/evidence.yaml:ro
      - ./config/evidence/local/evidence/public-keys:/etc/registry-evidence/bundle/public-keys:ro
      - ./config/evidence/local/tls/ca.crt:/etc/registry-evidence/tls/lab-ca.crt:ro
      - evidence-secrets:/run/secrets/registry-evidence:ro
      - evidence-audit:/var/lib/registry-evidence/audit
    networks:
      evidence:
        ipv4_address: 172.29.0.10
    depends_on:
      evidence-audit-migrate: { condition: service_completed_successfully }
      evidence-gateway: { condition: service_started }
      cra-workload-agent: { condition: service_healthy }
      nia-workload-agent: { condition: service_healthy }
      sro-workload-agent: { condition: service_healthy }
      programme-workload-agent: { condition: service_healthy }
      sipf-workload-agent: { condition: service_healthy }
      nagdi-workload-agent: { condition: service_healthy }

  child-benefit-federator:
    build:
      context: .
      dockerfile: scenario-runner/Dockerfile
    image: ${SOLMARA_CHILD_BENEFIT_FEDERATOR_IMAGE:-solmara-lab-scenario-runner:local}
    command: ["python", "scenario-runner/child_benefit_federator.py"]
    environment:
      <<: *evidence-client-environment
      CHILD_BENEFIT_FEDERATOR_HOST: 0.0.0.0
      CHILD_BENEFIT_FEDERATOR_PORT: 8080
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN}
    ports: ["${SOLMARA_CHILD_BENEFIT_FEDERATOR_PORT:-4321}:8080"]
    volumes:
      - ./config/evidence/local/mint/client-private.jwk:/run/secrets/solmara-evidence-client.jwk:ro
      - ./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro
    networks: [default, evidence]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      evidence: { condition: service_started }
      mint: { condition: service_started }

  scenario-runner:
    build:
      context: .
      dockerfile: scenario-runner/Dockerfile
    image: ${SOLMARA_SCENARIO_RUNNER_IMAGE:-solmara-lab-scenario-runner:local}
    environment:
      <<: *evidence-client-environment
      SCENARIO_RUNNER_HOST: 0.0.0.0
      SCENARIO_RUNNER_PORT: 8080
      SOLMARA_LAB_MODE: local
      CHILD_BENEFIT_FEDERATOR_URL: http://child-benefit-federator:8080
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN}
    volumes:
      - ./config/evidence/local/mint/client-private.jwk:/run/secrets/solmara-evidence-client.jwk:ro
      - ./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro
    networks: [default, evidence]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      child-benefit-federator: { condition: service_healthy }

  portal:
    build:
      context: ./portal
    image: ${SOLMARA_PORTAL_IMAGE:-solmara-lab-portal:local}
    environment:
      <<: *evidence-client-environment
      HOST: 0.0.0.0
      PORT: 4000
      PORTAL_PROVIDER: live
      PORTAL_AUTH_PROVIDER: ${PORTAL_AUTH_PROVIDER:-mock}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      CHILD_BENEFIT_FEDERATOR_URL: http://child-benefit-federator:8080
      CHILD_BENEFIT_FEDERATOR_TOKEN: ${CHILD_BENEFIT_FEDERATOR_TOKEN}
      SCENARIO_RUNNER_URL: http://scenario-runner:8080
    ports: ["${SOLMARA_PORTAL_PORT:-4300}:4000"]
    volumes:
      - ./config/evidence/local/mint/client-private.jwk:/run/secrets/solmara-evidence-client.jwk:ro
      - ./config/evidence/local/tls/ca.crt:/etc/solmara-evidence/tls/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      scenario-runner: { condition: service_healthy }

  home:
    build:
      context: .
      dockerfile: home/Dockerfile
    image: ${SOLMARA_HOME_IMAGE:-solmara-lab-home:local}
    environment:
      HOST: 0.0.0.0
      PORT: 4301
      SOLMARA_LAB_ROOT: /app
      REPO_URL: ${REPO_URL:-https://github.com/registrystack/solmara-lab}
      PORTAL_URL: http://127.0.0.1:${SOLMARA_PORTAL_PORT:-4300}
      SCENARIO_RUNNER_URL: http://scenario-runner:8080
      STATIC_METADATA_URL: http://static-metadata:8080
      PORTAL_PROBE_URL: http://portal:4000
      CRA_CIVIL_RELAY_URL: http://cra-civil-relay:8080
      NIA_POPULATION_RELAY_URL: http://nia-population-relay:8080
      SRO_SOCIAL_RELAY_URL: http://sro-social-relay:8080
      PROGRAMME_MIS_RELAY_URL: http://programme-mis-relay:8080
      SIPF_PENSIONS_RELAY_URL: http://sipf-pensions-relay:8080
      NAGDI_AGRICULTURE_RELAY_URL: http://nagdi-agriculture-relay:8080
      EVIDENCE_URL: http://evidence:8080
      MINT_URL: http://mint:8081
      CHILD_BENEFIT_FEDERATOR_URL: http://child-benefit-federator:8080
      HOME_PUBLISHED_TOKENS: "{}"
    networks: [default, evidence]
    ports: ["${SOLMARA_HOME_PORT:-4301}:4301"]
    volumes:
      - ./output/smoke:/app/output/smoke:ro
      - ./generator/output:/app/generator/output:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4301/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      static-metadata: { condition: service_started }
      scenario-runner: { condition: service_healthy }

volumes:
  postgres-data:
  cra-relay-cache:
  nia-relay-cache:
  sro-relay-cache:
  programme-relay-cache:
  sipf-relay-cache:
  nagdi-relay-cache:
  evidence-secrets:
  evidence-audit:
  mint-secrets:
  mint-audit:
  nia-esignet-workload-token:
  caddy-data:
  caddy-config:

networks:
  evidence:
    ipam:
      config:
        - subnet: 172.29.0.0/24
